// ── F3-02: Componente de Paginação ─────────────────────────────────────────────
const ITEMS_POR_PAGINA = 20;

function Paginacao({ total, pagina, setPagina }) {
  const totalPaginas = Math.ceil(total / ITEMS_POR_PAGINA);
  if (totalPaginas <= 1) return null;

  const inicio = (pagina - 1) * ITEMS_POR_PAGINA + 1;
  const fim    = Math.min(pagina * ITEMS_POR_PAGINA, total);

  // Gerar páginas visíveis: sempre mostra 1, última e até 3 ao redor da atual
  const paginas = [];
  for (let i = 1; i <= totalPaginas; i++) {
    if (i === 1 || i === totalPaginas || (i >= pagina - 1 && i <= pagina + 1)) {
      paginas.push(i);
    } else if (paginas[paginas.length - 1] !== '...') {
      paginas.push('...');
    }
  }

  const btnStyle = (ativo, disabled) => ({
    padding: '6px 11px', borderRadius: 8, border: '1px solid',
    borderColor: ativo ? '#0f2044' : '#e2e8f0',
    background: ativo ? '#0f2044' : disabled ? '#f8fafc' : '#fff',
    color: ativo ? '#c8a84b' : disabled ? '#cbd5e1' : '#475569',
    fontWeight: ativo ? 700 : 500, fontSize: 13,
    cursor: disabled ? 'not-allowed' : 'pointer',
    minWidth: 36, textAlign: 'center',
  });

  return React.createElement('div', {
    style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between',
             flexWrap: 'wrap', gap: 8, marginTop: 16,
             padding: '12px 16px', background: '#f8fafc',
             borderRadius: 12, border: '1px solid #e2e8f0' }
  },
    React.createElement('span', { style: { fontSize: 13, color: '#64748b' } },
      `Exibindo ${inicio}–${fim} de ${total} registro${total !== 1 ? 's' : ''}`
    ),
    React.createElement('div', { style: { display: 'flex', gap: 4, flexWrap: 'wrap' } },
      // Anterior
      React.createElement('button', {
        onClick: () => setPagina(p => Math.max(1, p - 1)),
        disabled: pagina === 1,
        style: btnStyle(false, pagina === 1)
      }, '←'),
      // Páginas
      ...paginas.map((p, i) =>
        p === '...'
          ? React.createElement('span', { key: `ellipsis-${i}`, style: { padding: '6px 4px', color: '#94a3b8', fontSize: 13 } }, '…')
          : React.createElement('button', {
              key: p,
              onClick: () => setPagina(p),
              style: btnStyle(p === pagina, false)
            }, p)
      ),
      // Próxima
      React.createElement('button', {
        onClick: () => setPagina(p => Math.min(totalPaginas, p + 1)),
        disabled: pagina === totalPaginas,
        style: btnStyle(false, pagina === totalPaginas)
      }, '→')
    )
  );
}

<script>
// ── Registro do Service Worker (PWA) ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('[PWA] SW registrado v10.15:', reg.scope);
        // Verifica atualização imediatamente e a cada 60s
        reg.update();
        setInterval(() => reg.update(), 60000);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              // Novo SW pronto — ativa imediatamente
              nw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        });
      })
      .catch(err => console.warn('[PWA] Falha:', err));
  });
  let refreshing = false;
  // Recarrega quando o SW assume controle (controllerchange)
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
  // Recarrega quando SW v10 envia mensagem SW_UPDATED
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'SW_UPDATED' && !refreshing) {
      console.log('[PWA] Nova versão disponível — recarregando...');
      refreshing = true;
      window.location.reload();
    }
  });
}

// ── Prompt de instalação (Android) ───────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Mostra botão de instalar se disponível
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] App instalado com sucesso!');
  deferredPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.style.display = 'none';
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      console.log('[PWA] Usuário escolheu:', choice.outcome);
      deferredPrompt = null;
    });
  }
}
</script>
