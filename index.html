                style: {background:"rgba(255,255,255,0.08)",border:"1px solid rgba(200,168,75,0.3)",borderRadius:8,color:"white",padding:"4px 10px",fontSize:12,fontWeight:600,cursor:"pointer",outline:"none"}
              }
              , React.createElement('option', { value:""}, "🌐 Todos")
              , condos.map(c=>React.createElement('option', { key:c.id, value:c.id, style:{color:"#1a2744",background:"white"}}, c.sigla||c.nome))
            )
          )
          , React.createElement('div', { style: {display:"flex",gap:8,alignItems:"center"}}
            , inadAtivos>0 && React.createElement('div', { style: {background:"rgba(220,38,38,0.2)",color:"#fca5a5",padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,border:"1px solid rgba(220,38,38,0.3)"}}, "⚠️ ", inadAtivos, " inad.")
            , ocoAbertas>0 && React.createElement('div', { style: {background:"rgba(217,119,6,0.2)",color:"#fcd34d",padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,border:"1px solid rgba(217,119,6,0.3)"}}, "📩 ", ocoAbertas, " aber.")
            , React.createElement('div', { style: {width:34,height:34,borderRadius:"50%",background:"linear-gradient(135deg,#c8a84b,#e8c96b)",display:"flex",alignItems:"center",justifyContent:"center",color:"#0f2044",fontWeight:700,fontSize:13,cursor:"pointer",title:nomeUsr}, onClick: ()=>setMod('perfil')}, nomeUsr[0].toUpperCase())
          )
        )

        /* Nav row */
        , React.createElement('nav', { style: {display:"flex",alignItems:"center",padding:"0 16px",gap:2}}
          , nav.map(n=>(
            React.createElement('button', { key:n.id, onClick:()=>setMod(n.id), style: {
              display:"flex",alignItems:"center",gap:7,padding:"10px 14px",
              border:"none",cursor:"pointer",fontSize:12.5,fontWeight:600,
              background:"transparent",
              color: mod===n.id ? "#c8a84b" : "rgba(200,210,230,0.65)",
              borderBottom: mod===n.id ? "2px solid #c8a84b" : "2px solid transparent",
              transition:"all 0.15s", whiteSpace:"nowrap"
            }}
              , React.createElement('span', { style: {fontSize:15}}, n.icon)
              , React.createElement('span', {}, n.label)
            )
          ))
          , React.createElement('div', { style: {flex:1}})
          , React.createElement('button', { onClick:logout, style:{background:"none",border:"1px solid rgba(200,168,75,0.3)",borderRadius:8,color:"rgba(200,168,75,0.7)",cursor:"pointer",fontSize:11,padding:"4px 12px",fontWeight:600}}, "Sair")
        )
      )

      /* Content */
      , React.createElement('div', { style: {flex:1,overflowY:"auto",padding:"24px"}}
        , mod==="dashboard"      && React.createElement(Dashboard, {   condos: condos, financeiro: fin, inadimplencia: inad, ocorrencias: oco, manutencoes: man, sel: sel})
        , mod==="condos"         && React.createElement(Condos, {      condos: condos, setCondos: setCondos, user: user})
        , mod==="financeiro"     && React.createElement(Financeiro, { condos: condos, fin: fin, setFin: setFin, sel: sel, user: user})
        , mod==="inadimplencia"  && React.createElement(Inadimplencia, { condos: condos, inadimplencia: inad, setInadimplencia: setInad, sel: sel, user: user})
        , mod==="ocorrencias"    && React.createElement(Ocorrencias, { condos: condos, ocorrencias: oco, setOcorrencias: setOco, sel: sel, user: user})
        , mod==="manutencoes"    && React.createElement(Manutencoes, { condos: condos, manutencoes: man,  setManutencoes: setMan, sel: sel, user: user})
        , mod==="orcamento"      && React.createElement(Orcamento, {   condos: condos, fin: fin, sel: sel, user: user})
        , mod==="perfil"         && React.createElement(Perfil, {      user: user, setUser: setUser})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, {}));
</script>
</body>
</html>
