// ── Sistema de Notificações ─────────────────────────────────────────────────
const NOTIF_KEY       = 'ps_notif_dismissed'; // localStorage: set de IDs ignorados
const NOTIF_SNOOZE    = 'ps_notif_snooze';    // localStorage: map id -> timestamp_reabrir
const NOTIF_HORIZON   = 3;                    // dias à frente para verificar

const notifDismissed = () => {
  try { return new Set(JSON.parse(localStorage.getItem(NOTIF_KEY)||'[]')); }
  catch(e){ return new Set(); }
};
const notifSnooze = () => {
  try { return JSON.parse(localStorage.getItem(NOTIF_SNOOZE)||'{}'); }
  catch(e){ return {}; }
};
const notifDismiss = (id) => {
  const s = notifDismissed(); s.add(id);
  localStorage.setItem(NOTIF_KEY, JSON.stringify([...s]));
};
const notifSetSnooze = (id, ms) => {
  const s = notifSnooze();
  s[id] = Date.now() + ms;
  localStorage.setItem(NOTIF_SNOOZE, JSON.stringify(s));
};
const notifClearSnooze = (id) => {
  const s = notifSnooze(); delete s[id];
  localStorage.setItem(NOTIF_SNOOZE, JSON.stringify(s));
};

// Coleta todos os eventos próximos de todos os módulos
const coletarEventosPendentes = ({fin, inadimplencia, ocorrencias, manutencoes, jur, cal, sel}) => {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const horizonte = new Date(hoje); horizonte.setDate(horizonte.getDate() + NOTIF_HORIZON);
  const dismissed = notifDismissed();
  const snoozes   = notifSnooze();
  const agora     = Date.now();

  const check = (id, dataStr) => {
    if (!dataStr) return false;
    if (dismissed.has(id)) return false;
    if (snoozes[id] && snoozes[id] > agora) return false;
    const d = new Date(dataStr + 'T00:00:00');
    return d >= hoje && d <= horizonte;
  };

  const eventos = [];
  const condoFmt = (condo_id, condos) => condos?.find(c=>c.id===condo_id)?.nome || '';

  // Financeiro — vencimentos pendentes
  (fin||[]).filter(f=>(!sel||f.condo_id===sel.id)&&f.status!=='Pago').forEach(f=>{
    const id = 'fin_'+f.id;
    if (check(id, f.data)) eventos.push({
      id, tipo:'💰 Financeiro', titulo: f.descricao||'Lançamento financeiro',
      data: f.data, condo_id: f.condo_id,
      detalhe: 'Vencimento: R$ '+Number(f.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2}),
      cor:'#15803d'
    });
  });

  // Inadimplência — vencimento do acordo
  (inadimplencia||[]).filter(i=>(!sel||i.condo_id===sel.id)&&i.status!=='Quitado'&&i.data_vencimento_acordo).forEach(i=>{
    const id = 'inad_'+i.id;
    if (check(id, i.data_vencimento_acordo)) eventos.push({
      id, tipo:'⚠️ Inadimplência', titulo: 'Acordo: '+(i.morador||i.unidade||'Unidade'),
      data: i.data_vencimento_acordo, condo_id: i.condo_id,
      detalhe: 'Unidade '+( i.unidade||'')+'  |  R$ '+Number(i.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2}),
      cor:'#b45309'
    });
  });

  // Ocorrências — previsão de atendimento
  (ocorrencias||[]).filter(o=>(!sel||o.condo_id===sel.id)&&o.status!=='Resolvida'&&o.data_previsao_atendimento).forEach(o=>{
    const id = 'oco_'+o.id;
    if (check(id, o.data_previsao_atendimento)) eventos.push({
      id, tipo:'📩 Ocorrência', titulo: (o.descricao||'Ocorrência').slice(0,50),
      data: o.data_previsao_atendimento, condo_id: o.condo_id,
      detalhe: (o.local_condo?'Local: '+o.local_condo+'  |  ':'')+(o.tipo||''),
      cor:'#7c3aed'
    });
  });

  // Manutenções — data de conclusão prevista
  (manutencoes||[]).filter(m=>(!sel||m.condo_id===sel.id)&&m.status!=='Concluída'&&m.data_conclusao).forEach(m=>{
    const id = 'man_'+m.id;
    if (check(id, m.data_conclusao)) eventos.push({
      id, tipo:'🔧 Manutenção', titulo: (m.descricao||'Manutenção').slice(0,50),
      data: m.data_conclusao, condo_id: m.condo_id,
      detalhe: m.area||'',
      cor:'#0369a1'
    });
  });

  // Jurídico — prazos
  (jur||[]).filter(j=>(!sel||j.condo_id===sel.id)&&(j.status==='Aberto'||j.status==='Em Andamento')&&j.data_prazo).forEach(j=>{
    const id = 'jur_'+j.id;
    if (check(id, j.data_prazo)) eventos.push({
      id, tipo:'⚖️ Jurídico', titulo: j.titulo.slice(0,50),
      data: j.data_prazo, condo_id: j.condo_id,
      detalhe: j.tipo+(j.parte_contraria?' | vs. '+j.parte_contraria:''),
      cor:'#1e40af'
    });
  });

  // Calendário — eventos cadastrados
  (cal||[]).filter(e=>(!sel||e.condo_id===sel.id)&&e.status!=='Concluído'&&e.status!=='Cancelado'&&e.data_inicio).forEach(e=>{
    const id = 'cal_'+e.id;
    if (check(id, e.data_inicio)) eventos.push({
      id, tipo:'📅 '+e.tipo, titulo: e.titulo.slice(0,50),
      data: e.data_inicio, condo_id: e.condo_id,
      detalhe: e.descricao||'',
      cor:'#1d4ed8'
    });
  });

  // Ordena por data
  eventos.sort((a,b)=>a.data.localeCompare(b.data));
  return eventos;
};

const addonAtivo = (myAddons, codigo) => {
  const addon = (myAddons||[]).find(a => a.addon_codigo === codigo);
  if (!addon) return false;
  if (addon.status === 'ativo') return true;
  if (addon.status === 'trial' && addon.trial_fim) {
    return new Date(addon.trial_fim + 'T23:59:59') >= new Date();
  }
  return false;
};

const trialAtivoCheck = (cli) => {
  if (!cli || !cli.trial_ativo || !cli.trial_fim) return false;

  upsertMensalidade:(d)       => sb.from("mensalidades").upsert(d,{onConflict:"cliente_id,mes_referencia"}).select().single(),
  // Fornecedores
  getForn:  ()      => sb.from("fornecedores").select("*").eq("ativo",true).order("nome"),
  addForn:  d       => sb.from("fornecedores").insert(d).select().single(),
  updForn:  (id,d)  => sb.from("fornecedores").update(d).eq("id",id).select().single(),
  delForn:  id      => sb.from("fornecedores").update({ativo:false}).eq("id",id),
  // Jurídico
  getJur:   ()      => sb.from("juridico").select("*").order("data_prazo",{ascending:true,nullsFirst:false}),
  addJur:   d       => sb.from("juridico").insert(d).select().single(),
  updJur:   (id,d)  => sb.from("juridico").update(d).eq("id",id).select().single(),
  delJur:   id      => sb.from("juridico").delete().eq("id",id),
  // Calendário
  getCal:     ()       => sb.from("calendario").select("*").order("data_inicio",{ascending:true}),
  addCal:     d        => sb.from("calendario").insert(d).select().single(),
  updCal:     (id,d)   => sb.from("calendario").update(d).eq("id",id).select().single(),
  delCal:     id       => sb.from("calendario").delete().eq("id",id),
};

// ── Condomínios ────────────────────────────────────────────────────────────────
function Condos({condos, setCondos, user, clienteInfo, isAdmin}) {
  const [modal, setModal] = useState(false);
  const [form, setForm]   = useState({});
  const blank = {nome:"",sigla:"",endereco:"",cnpj:"",unidades:"",administradora:"",contato:"",cor:"#3B82F6"};
  const [saving,setSaving]=useState(false);
  const limite = isAdmin ? 999 : getLimiteCondo(clienteInfo);
  const atingiuLimite = !form.id && condos.length >= limite;
  const save_ = async() => {
    if(!form.nome) return;
    setSaving(true);
    try {
      const payload = {
        nome: form.nome, sigla: form.sigla||"", endereco: form.endereco||"",
        cnpj: form.cnpj||"", unidades: form.unidades||"",
        administradora: form.administradora||"", contato: form.contato||"",
        cor: form.cor||"#3B82F6",
      };
      if(form.id) {
        const {data,error} = await db.updCondo(form.id, payload);
        if(error) throw error;
        if(data) setCondos(p=>p.map(c=>c.id===form.id ? data : c));
      } else {
        const fullPayload = {...payload, owner_id:user.id};
        console.log('[DEBUG addCondo payload]', JSON.stringify(fullPayload));
        const {data,error} = await db.addCondo(fullPayload);
        console.log('[DEBUG addCondo result]', {data, error: error?.message});
        if(error) throw error;
        if(data) setCondos(p=>[...p, data]);
      }
      setModal(false);
    } catch(err) { alert("Erro ao salvar: "+err.message); }
    finally { setSaving(false); }
  };

    if(!email||!senha) return alert_("Preencha email e senha.","err");

    const {data,error} = await sb.auth.signInWithPassword({email,password:senha});
    setLoading(false);
    if(error) return alert_(error.message==="Invalid login credentials"?"Email ou senha incorretos.":error.message,"err");
    onLogin(data.user);
  };

    if(!nome||!email||!senha) return alert_("Preencha todos os campos.","err");
    if(senha.length<6) return alert_("Senha: mínimo 6 caracteres.","err");

    if (errCli || !cli) {

      setLoadMens(false);

                    , React.createElement('p',{style:{margin:'0 0 4px',fontSize:11,fontWeight:700,color:c}},l)
                    , React.createElement('p',{style:{margin:0,fontSize:16,fontWeight:800,color:c}},v)
                  ))
              );
            })()
          , loadMens
            ? React.createElement('p',{style:{textAlign:'center',color:'#94a3b8',padding:20}},'Carregando...')
            : mensData.length === 0
              ? React.createElement('p',{style:{textAlign:'center',color:'#94a3b8',padding:20}},
                  'Nenhuma mensalidade registrada para '+anoMens)
              : React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:6}}
                  , mensData.map(m => {
                      const statusCfg = {
                        pago:     {label:'Pago',      cor:'#15803d', bg:'#f0fdf4'},
                        em_atraso:{label:'Em atraso', cor:'#dc2626', bg:'#fef2f2'},
                        pendente: {label:'Pendente',  cor:'#a16207', bg:'#fffbeb'},
                        isento:   {label:'Isento',    cor:'#64748b', bg:'#f8fafc'},
                      }[m.status]||{label:m.status,cor:'#64748b',bg:'#f8fafc'};
                      const [ano,mes] = m.mes_referencia.split('-');
                      const mesNome = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][Number(mes)-1];
                      return React.createElement('div',{key:m.id,style:{
                          display:'flex',alignItems:'center',justifyContent:'space-between',
                          padding:'10px 14px',background:statusCfg.bg,borderRadius:10,gap:12}}
                        , React.createElement('span',{style:{fontWeight:700,fontSize:14,color:'#0f2044',minWidth:80}},
                            mesNome+'/'+ano)
                        , React.createElement('span',{style:{fontSize:14,color:'#475569'}},
                            'R$ '+Number(m.valor||0).toLocaleString('pt-BR',{minimumFractionDigits:2}))
                        , m.data_vencimento && React.createElement('span',{style:{fontSize:11,color:'#94a3b8'}},
                            'Venc: '+m.data_vencimento.slice(0,10))
                        , m.data_pagamento && React.createElement('span',{style:{fontSize:11,color:'#15803d'}},
                            'Pago: '+m.data_pagamento.slice(0,10))
                        , React.createElement('span',{style:{fontSize:11,fontWeight:700,color:statusCfg.cor,
                            background:'white',borderRadius:20,padding:'2px 10px',border:'1px solid '+statusCfg.cor}},
                            statusCfg.label)
                      );
                    })
                )
        )
      )
    )
  );
}


// ── PDF Reports ───────────────────────────────────────────────────────────────
const PDF = {
  NAVY: [15, 32, 68],
  GOLD: [200, 168, 75],
  LIGHT: [238, 241, 247],
  WHITE: [255, 255, 255],
  RED: [185, 28, 28],
  GREEN: [21, 128, 61],
  AMBER: [180, 83, 9],
  TEXT: [26, 39, 68],
  MUTED: [100, 116, 139],

  brl(v) { return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0); },
  hoje() { return new Date().toLocaleDateString("pt-BR"); },

  header(doc, titulo, condoNome, subtitulo="") {
    const W = doc.internal.pageSize.width;
    // Faixa Navy
    doc.setFillColor(...PDF.NAVY);
    doc.rect(0, 0, W, 28, "F");
    // Linha dourada
    doc.setFillColor(...PDF.GOLD);
    doc.rect(0, 28, W, 2, "F");
    // Logo lateral
    doc.setFillColor(...PDF.GOLD);
    doc.rect(10, 5, 3, 18, "F");
    // Titulo
    doc.setTextColor(...PDF.WHITE);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("Portal do Síndico", 17, 13);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(180, 190, 210);
    doc.text("PROFISSIONAL", 17, 19);
    // Título do relatório
    doc.setTextColor(...PDF.WHITE);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text(titulo, W/2, 13, {align:"center"});
    if (subtitulo) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(180, 190, 210);
      doc.text(subtitulo, W/2, 20, {align:"center"});
    }
    // Data e condomínio
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(180, 190, 210);
    doc.text(`${condoNome}  |  Gerado em ${PDF.hoje()}`, W-12, 13, {align:"right"});
    doc.text("Cácio Trajano — Portal do Síndico", W-12, 20, {align:"right"});
  },

  footer(doc) {
    const W = doc.internal.pageSize.width;
    const H = doc.internal.pageSize.height;
    const pages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFillColor(...PDF.NAVY);
      doc.rect(0, H-10, W, 10, "F");
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7);
      doc.setTextColor(...PDF.GOLD);
      doc.text("Portal do Síndico Profissional  |  Documento gerado automaticamente", 12, H-4);
      doc.setTextColor(180,190,210);
      doc.text(`Página ${i} de ${pages}`, W-12, H-4, {align:"right"});
    }
  },

  kpiBox(doc, x, y, w, h, label, value, color) {
    doc.setFillColor(...color);
    doc.roundedRect(x, y, w, h, 2, 2, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7);
    doc.setTextColor(...PDF.WHITE);
    doc.text(label.toUpperCase(), x+w/2, y+5, {align:"center"});
    doc.setFontSize(11);
    doc.text(value, x+w/2, y+12, {align:"center"});
  },

  sectionTitle(doc, text, y) {
    const W = doc.internal.pageSize.width;
    doc.setFillColor(...PDF.LIGHT);
    doc.rect(10, y, W-20, 8, "F");
    doc.setFillColor(...PDF.GOLD);
    doc.rect(10, y, 3, 8, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(...PDF.NAVY);
    doc.text(text, 16, y+5.5);
    return y + 10;
  },

  // ── RELATÓRIO FINANCEIRO SINTÉTICO ─────────────────────────────────────────
  financSintetico(condoNome, fin, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const W = doc.internal.pageSize.width;
    const dados = sel ? fin.filter(f=>f.condo_id===sel.id) : fin;

    PDF.header(doc, "RELATÓRIO FINANCEIRO SINTÉTICO", condoNome);
    let y = 36;

    // KPIs principais
    const rec = dados.filter(f=>f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);
    const dep = dados.filter(f=>f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
    const saldo = rec - dep;
    const pago  = dados.filter(f=>f.status==="Pago").reduce((s,f)=>s+Number(f.valor||0),0);
    const emAberto = dados.filter(f=>f.status==="Em aberto"&&f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);

    PDF.kpiBox(doc, 10, y, 37, 18, "Total Receitas", PDF.brl(rec), PDF.GREEN);
    PDF.kpiBox(doc, 50, y, 37, 18, "Total Despesas", PDF.brl(dep), PDF.RED);
    PDF.kpiBox(doc, 90, y, 37, 18, "Saldo", PDF.brl(saldo), saldo>=0 ? PDF.NAVY : PDF.RED);
    PDF.kpiBox(doc, 130, y, 37, 18, "Valores Pagos", PDF.brl(pago), [15, 118, 110]);
    PDF.kpiBox(doc, 170, y, 27, 18, "A Receber", PDF.brl(emAberto), PDF.AMBER);
    y += 24;

    // Saúde Financeira
    y = PDF.sectionTitle(doc, "SAÚDE FINANCEIRA", y);
    const pctDep = rec > 0 ? (dep/rec*100).toFixed(1) : 0;
    const situacao = saldo >= 0 ? "SUPERÁVIT" : "DÉFICIT";
    const corSit = saldo >= 0 ? [21,128,61] : [185,28,28];
    doc.setFillColor(...PDF.WHITE);
    doc.setDrawColor(...PDF.LIGHT);
    doc.roundedRect(10, y, W-20, 24, 2, 2, "FD");
    doc.setFont("helvetica","bold"); doc.setFontSize(10);
    doc.setTextColor(...corSit);
    doc.text(`Situação: ${situacao}`, 16, y+8);
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    doc.setTextColor(...PDF.TEXT);
    doc.text(`Índice de comprometimento de despesas: ${pctDep}% das receitas`, 16, y+16);
    const rating = pctDep < 60 ? "Excelente" : pctDep < 80 ? "Boa" : pctDep < 100 ? "Atenção" : "Crítica";
    doc.setFont("helvetica","bold");
    doc.setTextColor(pctDep < 80 ? PDF.GREEN[0] : PDF.RED[0], pctDep < 80 ? PDF.GREEN[1] : PDF.RED[1], pctDep < 80 ? PDF.GREEN[2] : PDF.RED[2]);
    doc.text(`Classificação: ${rating}`, 130, y+8);
    y += 28;

    // Resumo por mês
    y = PDF.sectionTitle(doc, "RESUMO MENSAL", y);
    const meses = [...new Set(dados.map(f=>f.mes))].filter(Boolean);
    const tabelaMeses = meses.map(m => {
      const r = dados.filter(f=>f.mes===m&&f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);
      const d = dados.filter(f=>f.mes===m&&f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
      return [m, PDF.brl(r), PDF.brl(d), PDF.brl(r-d)];
    });
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Mês","Receitas","Despesas","Saldo"]],
      body: tabelaMeses,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
      bodyStyles:{fontSize:8, textColor:PDF.TEXT},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right"}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===3) {
          const v = tabelaMeses[data.row.index]?.[3]||"";
          data.cell.styles.textColor = v.includes("-") ? PDF.RED : PDF.GREEN;
          data.cell.styles.fontStyle = "bold";
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    // Resumo por categoria
    y = PDF.sectionTitle(doc, "DESPESAS POR CATEGORIA", y);
    const cats = [...new Set(dados.filter(f=>f.tipo==="Despesa").map(f=>f.categoria))].filter(Boolean);
    const tabCat = cats.map(c=>{
      const tot = dados.filter(f=>f.categoria===c&&f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
      const pct = dep > 0 ? (tot/dep*100).toFixed(1)+"%" : "0%";
      return [c, PDF.brl(tot), pct];
    }).sort((a,b)=>b[1].localeCompare(a[1]));
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Categoria","Total","% do Total"]],
      body: tabCat,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
      bodyStyles:{fontSize:8},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{1:{halign:"right"},2:{halign:"center"}},
    });

    PDF.footer(doc);
    doc.save(`relatorio-sintetico-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },

  // ── RELATÓRIO INADIMPLÊNCIA ─────────────────────────────────────────────────
  inadimplencia(condoNome, inad, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const dados = sel ? inad.filter(i=>i.condo_id===sel.id) : inad;

    PDF.header(doc, "RELATÓRIO DE INADIMPLÊNCIA", condoNome);
    let y = 36;

    const ativos = dados.filter(i=>i.status==="Inadimplente");
    const acordo = dados.filter(i=>i.status==="Acordo");
    const judicial = dados.filter(i=>i.status==="Ação Judicial");
    const valorTotal = ativos.reduce((s,i)=>s+Number(i.valor||0),0);
    const W = doc.internal.pageSize.width;

    PDF.kpiBox(doc, 10, y, 42, 18, "Inadimplentes", `${ativos.length} unid.`, PDF.RED);
    PDF.kpiBox(doc, 55, y, 42, 18, "Valor em Aberto", PDF.brl(valorTotal), PDF.AMBER);
    PDF.kpiBox(doc, 100, y, 42, 18, "Em Acordo", `${acordo.length} unid.`, [88,28,135]);
    PDF.kpiBox(doc, 145, y, 42, 18, "Ação Judicial", `${judicial.length} unid.`, PDF.NAVY);
    y += 24;

    y = PDF.sectionTitle(doc, "UNIDADES INADIMPLENTES", y);
    const rows = dados.map(i=>[
      i.unidade||"", i.bloco||"", i.morador||"",
      i.mes||"", PDF.brl(i.valor), i.dias_atraso||"0",
      i.status||"", i.notificacoes||"0"
    ]);
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Unidade","Bloco","Morador","Mês Ref.","Valor","Dias","Status","Notif."]],
      body: rows,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
      bodyStyles:{fontSize:8},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{4:{halign:"right",fontStyle:"bold"},5:{halign:"center"},7:{halign:"center"}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===6) {
          const s = rows[data.row.index]?.[6]||"";
          if(s==="Inadimplente") data.cell.styles.textColor=PDF.RED;
          else if(s==="Acordo") data.cell.styles.textColor=[88,28,135];
          else if(s==="Ação Judicial") data.cell.styles.textColor=PDF.AMBER;
          else if(s==="Regularizado") data.cell.styles.textColor=PDF.GREEN;
          data.cell.styles.fontStyle="bold";
        }
      }
    });
    y = doc.lastAutoTable.finalY + 8;

    // Alerta
    if(ativos.length > 0) {
      doc.setFillColor(254,242,242);
      doc.setDrawColor(...PDF.RED);
      doc.roundedRect(10, y, W-20, 14, 2, 2, "FD");
      doc.setFont("helvetica","bold"); doc.setFontSize(9);
      doc.setTextColor(...PDF.RED);
      doc.text(`⚠  Alerta: ${ativos.length} unidade(s) em situação de inadimplência — Total: ${PDF.brl(valorTotal)}`, 16, y+9);
    }

    PDF.footer(doc);
    doc.save(`relatorio-inadimplencia-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },

  // ── RELATÓRIO MANUTENÇÕES ──────────────────────────────────────────────────
  manutencoes(condoNome, man, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
    const dados = sel ? man.filter(m=>m.condo_id===sel.id) : man;

    PDF.header(doc, "RELATÓRIO DE MANUTENÇÕES", condoNome);
    let y = 36;

    const concluidas  = dados.filter(m=>m.status==="Concluída");
    const agendadas   = dados.filter(m=>m.status==="Agendada");
    const emExecucao  = dados.filter(m=>m.status==="Em execução");
    const totalGasto  = concluidas.reduce((s,m)=>s+Number(m.valor||0),0);
    const totalPrevi  = dados.reduce((s,m)=>s+Number(m.valor||0),0);

    PDF.kpiBox(doc, 10, y, 55, 16, "Total Gasto", PDF.brl(totalGasto), PDF.NAVY);
    PDF.kpiBox(doc, 70, y, 55, 16, "Previsto/Aberto", PDF.brl(totalPrevi-totalGasto), PDF.AMBER);
    PDF.kpiBox(doc, 130, y, 55, 16, "Concluídas", `${concluidas.length}`, PDF.GREEN);
    PDF.kpiBox(doc, 190, y, 55, 16, "Pendentes", `${agendadas.length+emExecucao.length}`, PDF.RED);
    y += 22;

    y = PDF.sectionTitle(doc, "REGISTRO DE MANUTENÇÕES", y);
    const rows = dados.map(m=>[
      m.data||"", m.tipo||"", m.area||"",
      (m.descricao||"").substring(0,50)+(m.descricao?.length>50?"...":""),
      m.fornecedor||"—", PDF.brl(m.valor),
      m.status||"", m.os||"—"
    ]);
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Data","Tipo","Área","Descrição","Fornecedor","Valor","Status","OS"]],
      body: rows,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:7},
      bodyStyles:{fontSize:7},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{5:{halign:"right",fontStyle:"bold"},0:{cellWidth:20},1:{cellWidth:22},2:{cellWidth:22},6:{cellWidth:24}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===6){
          const s=rows[data.row.index]?.[6]||"";
          if(s==="Concluída") data.cell.styles.textColor=PDF.GREEN;
          else if(s==="Em execução") data.cell.styles.textColor=PDF.AMBER;
          else if(s==="Agendada") data.cell.styles.textColor=PDF.NAVY;
          data.cell.styles.fontStyle="bold";
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    // Resumo por tipo
    if(y < 170) {
      y = PDF.sectionTitle(doc, "RESUMO POR TIPO", y);
      const tipos = [...new Set(dados.map(m=>m.tipo))].filter(Boolean);
      const tabTipos = tipos.map(t=>{
        const it = dados.filter(m=>m.tipo===t);
        const gasto = it.filter(m=>m.status==="Concluída").reduce((s,m)=>s+Number(m.valor||0),0);
        return [t, it.length+"", PDF.brl(gasto)];
      });
      doc.autoTable({
        startY: y, margin:{left:10,right:10}, tableWidth:120,
        head:[["Tipo","Qtd","Total Gasto"]],
        body: tabTipos,
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8},
        alternateRowStyles:{fillColor:PDF.LIGHT},
        columnStyles:{1:{halign:"center"},2:{halign:"right",fontStyle:"bold"}},
      });
    }

    PDF.footer(doc);
    doc.save(`relatorio-manutencoes-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },
};


// ── Ficha do Condômino ────────────────────────────────────────────────────────
function Condomino({condos, financeiro, inadimplencia, ocorrencias, condominos, setCondominos, sel, user}) {
  // ── estados de busca / ficha ──────────────────────────────────────────────
  const [busca,      setBusca]      = useState("");
  const [resultado,  setResultado]  = useState(null);
  const [sugestoes,  setSugestoes]  = useState([]);
  // ── estados do cadastro ───────────────────────────────────────────────────
  const [modal,  setModal]  = useState(false);
  const [form,   setForm]   = useState({});
  const [saving, setSaving] = useState(false);
  const [filtro, setFiltro] = useState("");
  const [paginaCon, setPaginaCon] = useState(1); // F3-02

  const blankForm = {
    condo_id:"", unidade:"", bloco:"", nome:"", telefone:"", email:"",
    tipo:"Proprietário",
    prop_nome:"", prop_telefone:"",
    imob_nome:"", imob_telefone:""
  };

  // Mescla: cadastrados + derivados da inadimplência (sem duplicata)
  const listaBase = React.useMemo(() => {
    // Moradores já cadastrados na tabela condominos
    const cadastrados = new Set(condominos.map(c => (c.nome||"").toLowerCase()+"_"+(c.condo_id||"")));

    // Derivar da inadimplência quem ainda não foi cadastrado
    const derivados = [];
    inadimplencia.forEach(i => {
      if (!i || !i.morador) return;
      const key = (i.morador||"").toLowerCase()+"_"+(i.condo_id||"");
      if (!cadastrados.has(key)) {
        cadastrados.add(key); // evita duplicata entre registros de inad
        derivados.push({
          id: "__inad__"+i.id,
          condo_id: i.condo_id,
          unidade:  i.unidade||"",
          bloco:    i.bloco||"",
          nome:     i.morador||"",
          telefone: i.telefone||"",
          email:    "",
          tipo:     "Proprietário",
          prop_nome: i.morador||"",
          prop_telefone: i.telefone||"",
          imob_nome: "",
          imob_telefone: "",
          _derivado: true,
        });
      }
    });

    return [...condominos, ...derivados];
  }, [condominos, inadimplencia]);

  // Filtro por condomínio e texto
  const lista = (sel ? listaBase.filter(c=>c.condo_id===sel.id) : listaBase)
    .filter(c => !filtro || (c.nome||"").toLowerCase().includes(filtro.toLowerCase())
      || (c.unidade||"").toLowerCase().includes(filtro.toLowerCase()))
    .sort((a,b)=>(a.unidade||"").localeCompare(b.unidade||"", "pt-BR", {numeric:true}));

  // ── CRUD ──────────────────────────────────────────────────────────────────
  const openNew = () => {
    setForm({...blankForm, condo_id: sel?.id || condos[0]?.id || ""});
    setModal(true);
  };
  const openEdit = (row) => {
    // Se for derivado da inadimplência, abre como novo cadastro pré-preenchido
    if(row._derivado) {
      setForm({...blankForm,
        condo_id: row.condo_id, unidade: row.unidade, bloco: row.bloco,
        nome: row.nome, telefone: row.telefone, tipo: "Proprietário",
        prop_nome: row.nome, prop_telefone: row.telefone,
      });
    } else {
      setForm({...row});
    }
    setModal(true);
  };

  const save_ = async () => {
    if(!form.nome || !form.unidade || !form.condo_id) return;
    setSaving(true);
    const payload = {
      condo_id: form.condo_id, unidade: form.unidade, bloco: form.bloco||"",
      nome: form.nome, telefone: form.telefone||"", email: form.email||"",
      tipo: form.tipo,
      prop_nome: form.tipo==="Proprietário" ? form.nome : (form.prop_nome||""),
      prop_telefone: form.tipo==="Proprietário" ? form.telefone : (form.prop_telefone||""),
      imob_nome: form.imob_nome||"", imob_telefone: form.imob_telefone||""
    };
    if(form.id) {
      const {data} = await db.updCondomino(form.id, payload);
      setCondominos(p => p.map(c => c.id===form.id ? data : c));
    } else {
      const {data} = await db.addCondomino({...payload, owner_id: user.id});
      setCondominos(p => [data, ...p]);
    }
    setSaving(false); setModal(false);
  };

  const del = async (id) => {
    if(!confirm("Remover condômino?")) return;
    await db.delCondomino(id);
    setCondominos(p => p.filter(c => c.id!==id));
  };

  // ── Busca para a ficha individual ─────────────────────────────────────────
  const todosNomes = React.useMemo(() => {
    const set = new Map();
    inadimplencia.forEach(i => {
      if(i && i.morador) {
        const key = i.morador.toLowerCase();
        if(!set.has(key)) set.set(key, {nome:i.morador, unidade:i.unidade, bloco:i.bloco, telefone:i.telefone, condo_id:i.condo_id});
      }
    });
    condominos.forEach(c => {
      if(c && c.nome) {
        const key = c.nome.toLowerCase();
        if(!set.has(key)) set.set(key, {nome:c.nome, unidade:c.unidade, bloco:c.bloco, telefone:c.telefone, condo_id:c.condo_id});
      }
    });
    return Array.from(set.values());
  }, [inadimplencia, condominos]);

  const handleBusca = (v) => {
    setBusca(v); setResultado(null);
    if(v.length < 2) { setSugestoes([]); return; }
    setSugestoes(todosNomes.filter(m => m.nome.toLowerCase().includes(v.toLowerCase())).slice(0, 8));
  };

  const selecionar = (morador) => {
    setBusca(morador.nome); setSugestoes([]);
    const condo = condos.find(c => c.id === morador.condo_id);
    const nomeCondo = condo ? condo.nome : "—";
    const inad = inadimplencia.filter(i => i && i.morador && i.morador.toLowerCase() === morador.nome.toLowerCase());
    const totalInad = inad.filter(i=>i.status==="Inadimplente").reduce((s,i)=>s+Number(i.valor||0),0);
    const totalPago = inad.filter(i=>i.status==="Regularizado").reduce((s,i)=>s+Number(i.valor||0),0);
    const notificacoes = inad.reduce((s,i)=>s+Number(i.notificacoes||0),0);
    const statusAtual = inad.length > 0 ? inad[0].status : "Sem registros";
    const oco = ocorrencias.filter(o => o && o.morador && o.morador.toLowerCase() === morador.nome.toLowerCase());
    const cadastro = condominos.find(c => c.nome && c.nome.toLowerCase() === morador.nome.toLowerCase());
    setResultado({ morador, condo: nomeCondo, inad, oco, totalInad, totalPago, notificacoes, statusAtual, cadastro });
  };

  const corStatus = (s) => {
    if(s==="Inadimplente"||s==="Ação Judicial") return "#dc2626";
    if(s==="Acordo") return "#7c3aed"; if(s==="Regularizado") return "#15803d"; return "#64748b";
  };

  const gerarPDF = () => {
    if(!resultado) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const W = doc.internal.pageSize.width;
    PDF.header(doc, "FICHA DO CONDÔMINO", resultado.condo);
    let y = 36;
    doc.setFillColor(238,241,247); doc.roundedRect(10, y, W-20, 30, 3, 3, "F");
    doc.setFillColor(15,32,68); doc.circle(26, y+15, 10, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(255,255,255);
    doc.text(resultado.morador.nome[0].toUpperCase(), 26, y+19, {align:"center"});
    doc.setTextColor(15,32,68); doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text(resultado.morador.nome, 42, y+10);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(100,116,139);
    doc.text(resultado.morador.unidade||"—", 42, y+18);
    doc.text("Condomínio: "+resultado.condo, 42, y+25);
    if(resultado.morador.telefone) doc.text("Tel: "+resultado.morador.telefone, 130, y+18);
    const corR = resultado.statusAtual==="Regularizado"||resultado.statusAtual==="Sem registros" ? [21,128,61] : [185,28,28];
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...corR);
    doc.text("Status: "+resultado.statusAtual, 130, y+10);
    y += 36;
    PDF.kpiBox(doc, 10, y, 42, 16, "Em Aberto", PDF.brl(resultado.totalInad), resultado.totalInad>0?PDF.RED:PDF.GREEN);
    PDF.kpiBox(doc, 55, y, 42, 16, "Regularizados", PDF.brl(resultado.totalPago), PDF.GREEN);
    PDF.kpiBox(doc, 100, y, 42, 16, "Notificações", ""+resultado.notificacoes, resultado.notificacoes>1?PDF.RED:PDF.AMBER);
    PDF.kpiBox(doc, 145, y, 42, 16, "Ocorrências", ""+resultado.oco.length, PDF.NAVY);

      doc.autoTable({

        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:PDF.LIGHT},
      });
      y = doc.lastAutoTable.finalY + 6;
    }
    if(resultado.inad.length > 0) {
      y = PDF.sectionTitle(doc, "HISTÓRICO FINANCEIRO / INADIMPLÊNCIA", y);
      doc.autoTable({
        startY: y, margin:{left:10,right:10},
        head:[["Mês","Valor","Dias","Status","Notif.","Obs."]],
        body: resultado.inad.map(i=>[i.mes||"",PDF.brl(i.valor),i.dias_atraso||"0",i.status||"",i.notificacoes||"0",i.obs||""]),
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:PDF.LIGHT},
        columnStyles:{1:{halign:"right",fontStyle:"bold"},4:{halign:"center"}},
      });
      y = doc.lastAutoTable.finalY + 6;
    }
    if(resultado.oco.length > 0) {
      y = PDF.sectionTitle(doc, "OCORRÊNCIAS", y);
      doc.autoTable({
        startY: y, margin:{left:10,right:10},
        head:[["Data","Tipo","Prior.","Status","Descrição"]],
        body: resultado.oco.map(o=>[o.data||"",o.tipo||"",o.prioridade||"",o.status||"",(o.descricao||"").substring(0,55)]),
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:PDF.LIGHT},
      });
    }
    PDF.footer(doc);
    doc.save("ficha-"+resultado.morador.nome.replace(/\s/g,"-")+".pdf");
  };

  // ── helpers de UI ─────────────────────────────────────────────────────────
  const badge = (tipo) => React.createElement('span', {style:{
    background: tipo==="Proprietário" ? "#0f2044" : "#7c3aed",
    color:"white", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700, whiteSpace:"nowrap"
  }}, tipo);

  const tdStyle = (i) => ({padding:"9px 12px", fontSize:12, borderBottom:"1px solid #f1f5f9",
    background: i%2===0 ? "#f8fafc" : "white"});
  const thStyle = {padding:"9px 12px", fontSize:11, fontWeight:700, color:"white",
    background:"#0f2044", textAlign:"left", whiteSpace:"nowrap"};

  // ── render ─────────────────────────────────────────────────────────────────
  return (
    React.createElement('div', {style:{display:"flex",flexDirection:"column",gap:16}}

      // ── Busca de ficha individual ──────────────────────────────────────────
      , React.createElement('div', {style:{background:"white",borderRadius:14,padding:20,
          boxShadow:"0 2px 10px rgba(15,32,68,0.07)",border:"1px solid #dce3f0"}}

        , React.createElement('h2', {style:{margin:"0 0 4px",fontFamily:"Playfair Display,serif",color:"#0f2044",fontSize:18}},
            "🔍 Ficha do Condômino")
        , React.createElement('p', {style:{margin:"0 0 14px",color:"#64748b",fontSize:13}},
            "Pesquise pelo nome para ver o histórico completo")

        // Campo busca

              value: busca, onChange: e => handleBusca(e.target.value),
              placeholder: "Digite o nome do condômino...",
              style:{width:"100%",padding:"12px 16px",fontSize:14,borderRadius:10,
                border:"2px solid #dce3f0",outline:"none",boxSizing:"border-box",color:"#1a2744"}
            })
          , busca.length > 0 && React.createElement('span', {
              onClick:()=>{setBusca("");setSugestoes([]);setResultado(null);},
              style:{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",
                cursor:"pointer",fontSize:18,color:"#94a3b8"}
            }, "×")
          , sugestoes.length > 0 && React.createElement('div', {
              style:{position:"absolute",top:"100%",left:0,right:0,background:"white",
                borderRadius:10,boxShadow:"0 8px 24px rgba(15,32,68,0.15)",
                border:"1px solid #dce3f0",zIndex:100,marginTop:4,overflow:"hidden"}
            }
            , sugestoes.map((m,i) => {
                const condo = condos.find(c=>c.id===m.condo_id);
                return React.createElement('div', {
                  key:i, onClick:()=>selecionar(m),
                  style:{padding:"10px 14px",cursor:"pointer",borderBottom:"1px solid #f1f5f9",
                    display:"flex",alignItems:"center",gap:12,background:i%2===0?"#f8fafc":"white"}
                }
                  , React.createElement('div', {style:{width:34,height:34,borderRadius:"50%",
                      background:"linear-gradient(135deg,#0f2044,#1a3260)",display:"flex",
                      alignItems:"center",justifyContent:"center",color:"#c8a84b",
                      fontWeight:800,fontSize:13,flexShrink:0}}, m.nome[0].toUpperCase())
                  , React.createElement('div', {}
                    , React.createElement('p', {style:{margin:0,fontWeight:700,fontSize:13,color:"#1a2744"}}, m.nome)
                    , React.createElement('p', {style:{margin:0,fontSize:11,color:"#64748b"}},

                 {l:"Regularizados",v:brl(resultado.totalPago),bg:"#15803d"},
                 {l:"Notificações",v:""+resultado.notificacoes,bg:resultado.notificacoes>1?"#b45309":"#0f2044"},
                 {l:"Ocorrências",v:""+resultado.oco.length,bg:"#0f2044"},
                ].map((k,i) => React.createElement('div', {key:i,style:{background:k.bg,borderRadius:10,padding:"10px 12px"}}
                  , React.createElement('p', {style:{margin:"0 0 3px",fontSize:9,fontWeight:700,color:"rgba(255,255,255,0.75)",textTransform:"uppercase"}}, k.l)
                  , React.createElement('p', {style:{margin:0,fontSize:17,fontWeight:800,color:"white"}}, k.v)
                ))
            )
            // Dados cadastrais se existir
            , resultado.cadastro && React.createElement('div', {style:{background:"white",borderRadius:10,padding:14,

                        , React.createElement('td',{style:{...tdStyle(idx),textAlign:"center"}},i.dias_atraso||"0")

// ── Importação de Dados ───────────────────────────────────────────────────────
function Importacao({condos, setCondos, setFin, setInad, setOco, setMan, setCondominos, user, clienteInfo, isAdmin}) {
  const [etapa,    setEtapa]    = useState("upload");
  const [arquivo,  setArquivo]  = useState(null);
  const [dados,    setDados]    = useState(null);
  const [condoSel, setCondoSel] = useState("");
  const [novoNome, setNovoNome] = useState("");
  const [novaSigla,setNovaSigla]= useState("");
  const [progresso,setProgresso]= useState({total:0,feito:0});
  const [log,      setLog]      = useState([]);

  const addLog = (msg, tipo="ok") => setLog(p => [...p, {msg, tipo, ts: new Date().toLocaleTimeString("pt-BR")}]);

  const lerArquivo = (file) => {
    if (!file) return;
    setArquivo(file);
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, {type:"array"});
      const parsed = {};
      const mapAba = {
        "Condom":       "condo",
        "Cond":         "condominos",
        "Financ":       "financeiro",
        "Inadimpl":     "inadimplencia",
        "Ocorr":        "ocorrencias",
        "Manuten":      "manutencoes",
      };
      wb.SheetNames.forEach(name => {
        const cleanName = name.replace(/\p{Emoji}/gu, "").trim();
        const key = Object.entries(mapAba).find(([k]) => cleanName.startsWith(k))?.[1];
        if (!key) return;
        const ws = wb.Sheets[name];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
        parsed[key] = rows.filter(r =>
          Object.values(r).some(v => {
            const s = String(v||"").trim();
            return s !== "" && !s.startsWith("Ex:") && !s.startsWith("\u2191");
          })
        );
      });
      setDados(parsed);
      if (parsed.condo?.[0]) {
        setNovoNome(parsed.condo[0]["Nome *"] || parsed.condo[0]["Nome"] || "");
        setNovaSigla(parsed.condo[0]["Sigla *"] || parsed.condo[0]["Sigla"] || "");
      }
      setEtapa("preview");
    };
    reader.readAsArrayBuffer(file);
  };

  const contagem = dados ? {
    condominos:    dados.condominos?.length    || 0,
    financeiro:    dados.financeiro?.length    || 0,
    inadimplencia: dados.inadimplencia?.length || 0,
    ocorrencias:   dados.ocorrencias?.length   || 0,
    manutencoes:   dados.manutencoes?.length   || 0,
  } : {};

  const importar = async () => {
    setEtapa("importando"); setLog([]);
    let condo_id = condoSel;
    const owner_id = user.id;
    const total = Object.values(contagem).reduce((a,b)=>a+b,0);
    let feito = 0;
    setProgresso({total, feito:0});

    // Verifica limite do plano
    if (!condo_id) {
      const limite = isAdmin ? 999 : getLimiteCondo(clienteInfo);
      if (condos.length >= limite) {
        addLog("Limite de condomínios do plano atingido (" + limite + "). Solicite upgrade.", "erro");
        setEtapa("preview"); return;
      }
    }
    if (!condo_id) {
      addLog("Criando condominio...", "info");
      const cd = dados.condo?.[0] || {};
      const {data, error} = await db.addCondo({
        owner_id,
        nome:           novoNome || cd["Nome *"] || cd["Nome"] || "Novo Condominio",
        sigla:          novaSigla || cd["Sigla *"] || cd["Sigla"] || "NC",
        endereco:       cd["Endereco"] || cd["Endere\u00e7o"] || "",
        cnpj:           cd["CNPJ"] || "",
        unidades:       cd["Unidades"] || "",
        administradora: cd["Administradora"] || "",
        contato:        cd["Contato Adm."] || cd["Contato"] || "",
        cor:            cd["Cor (hex)"] || "#3B82F6",
      });
      if (error) { addLog("Erro: "+error.message, "erro"); setEtapa("preview"); return; }
      condo_id = data.id;
      setCondos(p => [...p, data]);
      addLog("Condominio criado: "+data.nome, "ok");
    } else {
      addLog("Condominio selecionado existente.", "info");
    }

    const toNum = v => Number(String(v||"0").replace(",",".")) || 0;

    if (dados.condominos?.length) {
      addLog("Importando "+dados.condominos.length+" condominos...", "info");
      let ok = 0;
      for (const row of dados.condominos) {
        const nome = row["Nome Cond\u00f4mino *"] || row["Nome Condomino"] || row["Nome"] || "";
        if (!nome) continue;
        const tipo = row["Tipo *"] || row["Tipo"] || "Propriet\u00e1rio";
        const {data, error} = await db.addCondomino({
          owner_id, condo_id,
          unidade:       row["Unidade *"] || row["Unidade"] || "",
          bloco:         row["Bloco"] || "",
          nome, tipo,
          telefone:      row["Telefone"] || "",
          email:         row["E-mail"] || row["Email"] || "",
          prop_nome:     tipo==="Propriet\u00e1rio" ? nome : (row["Nome Propriet\u00e1rio"] || ""),
          prop_telefone: tipo==="Propriet\u00e1rio" ? (row["Telefone"]||"") : (row["Tel. Propriet\u00e1rio"] || ""),
          imob_nome:     row["Nome Imobili\u00e1ria"] || "",
          imob_telefone: row["Tel. Imobili\u00e1ria"] || "",
        });
        if (!error && data) { setCondominos(p=>[...p, data]); ok++; }
        feito++; setProgresso({total, feito});
      }
      addLog(ok+" condominos importados.", "ok");
    }

    if (dados.financeiro?.length) {
      addLog("Importando "+dados.financeiro.length+" lancamentos...", "info");
      let ok = 0;
      for (const row of dados.financeiro) {
        const desc = row["Descri\u00e7\u00e3o *"] || row["Descricao"] || row["Descri\u00e7\u00e3o"] || "";
        if (!desc) continue;
        const {data, error} = await db.addFin({
          owner_id, condo_id,
          data:       row["Data *"] || row["Data"] || "",
          mes:        row["M\u00eas *"] || row["Mes"] || "",
          descricao:  desc,
          categoria:  row["Categoria *"] || row["Categoria"] || "Outros",
          tipo:       row["Tipo *"] || row["Tipo"] || "Receita",
          valor:      toNum(row["Valor (R$) *"] || row["Valor"]),
          status:     row["Status *"] || row["Status"] || "Pago",
          forma_pgto: row["Forma Pgto"] || "",
          obs:        row["Observa\u00e7\u00f5es"] || "",
        });
        if (!error && data) { setFin(p=>[...p, data]); ok++; }
        feito++; setProgresso({total, feito});
      }
      addLog(ok+" lancamentos importados.", "ok");
    }

    if (dados.inadimplencia?.length) {
      addLog("Importando "+dados.inadimplencia.length+" inadimplencias...", "info");
      let ok = 0;
      for (const row of dados.inadimplencia) {
        const morador = row["Morador *"] || row["Morador"] || "";
        if (!morador) continue;
        const {data, error} = await db.addInad({
          owner_id, condo_id,
          mes:         row["M\u00eas Ref. *"] || row["Mes"] || "",
          unidade:     row["Unidade *"] || row["Unidade"] || "",
          bloco:       row["Bloco"] || "",
          morador,
          telefone:    row["Telefone"] || "",
          valor:       toNum(row["Valor (R$) *"] || row["Valor"]),
          dias_atraso: Number(row["Dias Atraso"] || 0),
          status:      row["Status *"] || row["Status"] || "Inadimplente",
          notificacoes:Number(row["Notifica\u00e7\u00f5es"] || 0),
          obs:         row["Observa\u00e7\u00f5es"] || "",
        });
        if (!error && data) { setInad(p=>[...p, data]); ok++; }
        feito++; setProgresso({total, feito});
      }
      addLog(ok+" inadimplencias importadas.", "ok");
    }

    if (dados.ocorrencias?.length) {
      addLog("Importando "+dados.ocorrencias.length+" ocorrencias...", "info");
      let ok = 0;
      for (const row of dados.ocorrencias) {
        const desc = row["Descri\u00e7\u00e3o *"] || row["Descricao"] || "";
        if (!desc) continue;
        const {data, error} = await db.addOco({
          owner_id, condo_id,
          data:        row["Data *"] || row["Data"] || "",
          unidade:     row["Unidade *"] || row["Unidade"] || "",
          morador:     row["Morador *"] || row["Morador"] || "",
          tipo:        row["Tipo *"] || row["Tipo"] || "Reclama\u00e7\u00e3o",
          prioridade:  row["Prioridade *"] || row["Prioridade"] || "M\u00e9dia",
          status:      row["Status *"] || row["Status"] || "Aberta",
          responsavel: row["Respons\u00e1vel"] || "",
          descricao:   desc,
          resolucao:   row["Resolu\u00e7\u00e3o"] || "",
          numero:      "IMP-"+Date.now(),
          mes:         "",
        });
        if (!error && data) { setOco(p=>[...p, data]); ok++; }
        feito++; setProgresso({total, feito});
      }
      addLog(ok+" ocorrencias importadas.", "ok");
    }

    if (dados.manutencoes?.length) {
      addLog("Importando "+dados.manutencoes.length+" manutencoes...", "info");
      let ok = 0;
      for (const row of dados.manutencoes) {
        const desc = row["Descri\u00e7\u00e3o *"] || row["Descricao"] || "";
        if (!desc) continue;
        const {data, error} = await db.addMan({
          owner_id, condo_id,
          data:           row["Data de In\u00edcio *"] || row["Data de In\u00edcio"] || row["Data *"] || row["Data"] || "",
          data_conclusao: row["Previs\u00e3o de Conclus\u00e3o"] || "",
          data_realizada: row["Data de Conclus\u00e3o Real"] || "",
          tipo:           row["Tipo *"] || row["Tipo"] || "Preventiva",
          area:           row["\u00c1rea/Sistema *"] || row["\u00c1rea *"] || row["Area"] || "",
          descricao:      desc,
          fornecedor:     row["Fornecedor"] || "",
          valor:          toNum(row["Valor (R$)"] || row["Valor"]),
          status:         row["Status *"] || row["Status"] || "Agendada",
          os:             row["OS/Contrato"] || row["OS"] || "",
          obs:            row["Observa\u00e7\u00f5es"] || "",
          mes:            "",
        });
        if (!error && data) { setMan(p=>[...p, data]); ok++; }
        feito++; setProgresso({total, feito});
      }
      addLog(ok+" manutencoes importadas.", "ok");
    }

    addLog("Importacao concluida!", "ok");
    setEtapa("concluido");
  };

  const pct = progresso.total > 0 ? Math.round(progresso.feito/progresso.total*100) : 0;
  const card = (icon, label, val, bg) =>
    React.createElement('div', {style:{background:bg,borderRadius:12,padding:"14px 18px"}}
      , React.createElement('p', {style:{margin:"0 0 4px",fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.7)",textTransform:"uppercase"}}, icon+" "+label)
      , React.createElement('p', {style:{margin:0,fontSize:24,fontWeight:800,color:"white"}}, val)
    );

  return (
    React.createElement('div', {style:{maxWidth:820,margin:"0 auto",display:"flex",flexDirection:"column",gap:16}}
      , React.createElement('div', {}
        , React.createElement('h2', {style:{margin:"0 0 4px",fontFamily:"Playfair Display,serif",color:"#0f2044",fontSize:22}}, "\uD83D\uDCE5 Importa\u00e7\u00e3o de Dados")
        , React.createElement('p', {style:{margin:0,color:"#64748b",fontSize:13}}, "Importe dados de um novo condom\u00ednio via planilha Excel")
      )

      , etapa === "upload" && React.createElement('div', {style:{display:"flex",flexDirection:"column",gap:14}}
          , React.createElement('div', {style:{background:"linear-gradient(135deg,#0f2044,#1a3260)",borderRadius:14,padding:20,
              display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}
            , React.createElement('div', {}
              , React.createElement('p', {style:{margin:"0 0 4px",fontWeight:800,fontSize:15,color:"white"}}, "\uD83D\uDCCB Template Excel")
              , React.createElement('p', {style:{margin:0,fontSize:12,color:"rgba(200,168,75,0.8)"}}, "Envie esta planilha ao cliente para preencher os dados")
            )
            , React.createElement('a', {href:"https://caciotrajano.github.io/gestao.condo/template_importacao_condominio.xlsx",download:true,
                style:{background:"#c8a84b",color:"#0f2044",borderRadius:10,padding:"10px 20px",
                  fontSize:13,fontWeight:800,textDecoration:"none",whiteSpace:"nowrap"}}, "\u2B07 Baixar Template")
          )
          , React.createElement('div', {
              onDrop:e=>{e.preventDefault();lerArquivo(e.dataTransfer.files[0]);},
              onDragOver:e=>e.preventDefault(),
              onClick:()=>document.getElementById("file-import").click(),
              style:{background:"white",borderRadius:14,padding:40,textAlign:"center",
                border:"2px dashed #dce3f0",cursor:"pointer",boxShadow:"0 2px 10px rgba(15,32,68,0.07)"}
            }
            , React.createElement('input', {id:"file-import",type:"file",accept:".xlsx,.xls",

// ── Projetos ─────────────────────────────────────────────────────────────────
function Projetos({condos, projetos, setProjetos, forn, sel, user, isAdmin}) {
  const [verProjeto,  setVerProjeto]  = useState(null); // projeto aberto em detalhe
  const [modal,       setModal]       = useState(false);
  const [saving,      setSaving]      = useState(false);
  const [etapas,      setEtapas]      = useState([]);
  const [diario,      setDiario]      = useState([]);
  const [loadingDet,  setLoadingDet]  = useState(false);
  const [novaDiario,  setNovaDiario]  = useState({titulo:'', texto:'', url_doc:''});
  const [modalEtapa,  setModalEtapa]  = useState(false);
  const [formEtapa,   setFormEtapa]   = useState({nome:'', descricao:'', duracao_dias:7, tipo:'sequencial', status:'Pendente'});
  const [form, setForm] = useState({
    nome:'', descricao:'', responsavel:'', fornecedor_id:'',
    valor_previsto:'', data_inicio:'', data_fim_prevista:'',
    status:'Planejando', obs:'', condo_id:''
  });

  const dados = projetos.filter(p => !sel || p.condo_id === sel.id);

  const brl = v => 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2});

  // Recalcula datas das etapas sequenciais considerando atrasos
  const recalcularCronograma = (etapasList, dataInicioProjeto) => {
    if (!etapasList.length || !dataInicioProjeto) return etapasList;
    let dataBase = new Date(dataInicioProjeto + 'T00:00:00');
    let atrasoAcumulado = 0;

    return etapasList.map((et, i) => {
      const inicio = new Date(dataBase);
      const fimPrevisto = new Date(inicio);
      fimPrevisto.setDate(fimPrevisto.getDate() + Number(et.duracao_dias||7));

      // Calcula atraso desta etapa
      if (et.status === 'Concluída' && et.data_fim_real) {
        const fimReal = new Date(et.data_fim_real + 'T00:00:00');
        const diffDias = Math.ceil((fimReal - fimPrevisto) / 86400000);
        if (et.tipo !== 'paralela' && diffDias > 0) atrasoAcumulado += diffDias;
      } else if (et.status !== 'Concluída' && et.status !== 'Cancelada') {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        if (fimPrevisto < hoje && et.tipo !== 'paralela') {
          const atrasoDias = Math.ceil((hoje - fimPrevisto) / 86400000);
          atrasoAcumulado = Math.max(atrasoAcumulado, atrasoDias);
        }
      }

      const fimComAtraso = new Date(fimPrevisto);
      if (et.tipo !== 'paralela') fimComAtraso.setDate(fimComAtraso.getDate() + atrasoAcumulado);

      // Próxima etapa sequencial começa onde esta termina
      if (et.tipo !== 'paralela') dataBase = new Date(fimComAtraso);

      return {
        ...et,
        _inicio_calc: inicio.toISOString().slice(0,10),
        _fim_calc:    fimComAtraso.toISOString().slice(0,10),
        _atraso:      atrasoAcumulado,
      };
    });
  };

  const abrirDetalhe = async (proj) => {
    setVerProjeto(proj);
    setLoadingDet(true);
    const [et, di] = await Promise.all([db.getEtapas(proj.id), db.getDiario(proj.id)]);
    setEtapas(recalcularCronograma(et.data||[], proj.data_inicio));
    setDiario(di.data||[]);
    setLoadingDet(false);
  };

  const save_ = async () => {
    if (!form.nome) return;
    setSaving(true);
    try {
      const payload = {...form, owner_id: user.id,
        condo_id: form.condo_id || sel?.id || condos[0]?.id || null,
        valor_previsto: form.valor_previsto ? Number(form.valor_previsto) : null,
        fornecedor_id: form.fornecedor_id || null,
      };
      if (form.id) {
        const {data,error} = await db.updProjeto(form.id, payload);
        if (error) throw error;
        if (data) { setProjetos(p=>p.map(x=>x.id===form.id?data:x)); setVerProjeto(data); }
      } else {
        const {data,error} = await db.addProjeto(payload);
        if (error) throw error;
        if (data) setProjetos(p=>[data,...p]);
      }
      setModal(false);
    } catch(err) { alert('Erro: '+err.message); }
    finally { setSaving(false); }
  };

  const salvarEtapa = async () => {
    if (!formEtapa.nome || !verProjeto) return;
    const ordem = etapas.length;
    const {data,error} = await db.addEtapa({...formEtapa, projeto_id: verProjeto.id, ordem,
      duracao_dias: Number(formEtapa.duracao_dias||7)});
    if (error) { alert('Erro: '+error.message); return; }
    const novas = recalcularCronograma([...etapas, data], verProjeto.data_inicio);
    setEtapas(novas);
    setModalEtapa(false);
    setFormEtapa({nome:'', descricao:'', duracao_dias:7, tipo:'sequencial', status:'Pendente'});
  };

  const toggleEtapa = async (et) => {
    const novoStatus = et.status === 'Concluída' ? 'Pendente' : 'Concluída';
    const hoje = new Date().toISOString().slice(0,10);
    const payload = {status: novoStatus, data_fim_real: novoStatus==='Concluída' ? hoje : null};
    const {data,error} = await db.updEtapa(et.id, payload);
    if (error) return;
    const atualizadas = recalcularCronograma(
      etapas.map(e=>e.id===et.id?{...e,...data}:e), verProjeto.data_inicio);
    setEtapas(atualizadas);
    // Atualiza data_fim_prevista do projeto
    const ultimaSeq = [...atualizadas].reverse().find(e=>e.tipo==='sequencial');
    if (ultimaSeq?._fim_calc) {
      await db.updProjeto(verProjeto.id, {data_fim_prevista: ultimaSeq._fim_calc});
      setVerProjeto(p=>({...p, data_fim_prevista: ultimaSeq._fim_calc}));
    }
  };

  const addDiarioEntry = async () => {
    if (!novaDiario.texto) return;
    const {data,error} = await db.addDiario({...novaDiario, projeto_id: verProjeto.id,
      data: new Date().toISOString().slice(0,10)});
    if (error) return;
    setDiario(p=>[data,...p]);
    setNovaDiario({titulo:'', texto:'', url_doc:''});
  };

  const delProjeto = async (id) => {
    if (!confirm('Excluir este projeto e todas as suas etapas?')) return;
    await db.delProjeto(id);
    setProjetos(p=>p.filter(x=>x.id!==id));
    if (verProjeto?.id===id) setVerProjeto(null);
  };

  const progresso = (ets) => {
    if (!ets.length) return 0;
    return Math.round(ets.filter(e=>e.status==='Concluída').length/ets.length*100);
  };

  const prazoStatus = (proj) => {
    if (!proj.data_fim_prevista||proj.status==='Concluído') return null;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const fim = new Date(proj.data_fim_prevista+'T00:00:00');
    const diff = Math.ceil((fim-hoje)/86400000);
    if (diff<0)   return {label:'Atrasado '+Math.abs(diff)+'d', cor:'#dc2626', bg:'#fee2e2'};
    if (diff<=14) return {label:'Vence em '+diff+'d',           cor:'#a16207', bg:'#fef9c3'};
    return null;
  };

  const statusCor = {Planejando:'#64748b',  'Em andamento':'#1d4ed8', Concluído:'#15803d', Cancelado:'#dc2626'};

  // ── DETALHE DO PROJETO ────────────────────────────────────────────────────
  if (verProjeto) {
    const pct = progresso(etapas);
    const ps  = prazoStatus(verProjeto);
    const atrasoGlobal = etapas.reduce((mx,e)=>Math.max(mx,e._atraso||0),0);

    return React.createElement('div', {className:'space-y-4'}
      , React.createElement('div', {className:'flex items-center gap-3 flex-wrap'}
        , React.createElement('button', {onClick:()=>setVerProjeto(null),
            style:{background:'#f1f5f9',border:'none',borderRadius:8,padding:'6px 14px',
                   fontSize:13,cursor:'pointer',fontWeight:600,color:'#334155'}}, '← Voltar')
        , React.createElement('h2', {className:'text-xl font-bold text-slate-800'}, verProjeto.nome)
        , React.createElement('span', {style:{background:statusCor[verProjeto.status]||'#64748b',
            color:'#fff',borderRadius:20,padding:'3px 12px',fontSize:12,fontWeight:700}},
            verProjeto.status)
        , ps && React.createElement('span', {style:{background:ps.bg,color:ps.cor,
            borderRadius:20,padding:'3px 12px',fontSize:12,fontWeight:700}}, '⚠️ '+ps.label)
        , atrasoGlobal > 0 && React.createElement('span', {style:{fontSize:12,color:'#dc2626',fontWeight:600}},
            '(impacto acumulado: +'+atrasoGlobal+' dias)')
        , React.createElement('button', {onClick:()=>{setForm({...verProjeto,fornecedor_id:verProjeto.fornecedor_id||''});setModal(true);},
            style:{marginLeft:'auto',background:'#0f2044',color:'#c8a84b',border:'none',
                   borderRadius:8,padding:'6px 14px',fontSize:12,fontWeight:700,cursor:'pointer'}},
            '✏️ Editar')
        , React.createElement('button', {onClick:()=>delProjeto(verProjeto.id),
            style:{background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:8,
                   padding:'6px 14px',fontSize:12,fontWeight:700,cursor:'pointer'}}, '🗑️')
      )

      // Barra de progresso
      , React.createElement('div', {style:{background:'#f1f5f9',borderRadius:12,padding:'16px 20px'}}
        , React.createElement('div', {style:{display:'flex',justifyContent:'space-between',marginBottom:8}}
          , React.createElement('span', {style:{fontSize:13,fontWeight:700,color:'#0f2044'}}, 'Progresso geral')
          , React.createElement('span', {style:{fontSize:13,fontWeight:800,color:'#0f2044'}}, pct+'%')
        )
        , React.createElement('div', {style:{background:'#dce3f0',borderRadius:10,height:10}}
          , React.createElement('div', {style:{background:pct===100?'#15803d':'#1d4ed8',
              width:pct+'%',height:10,borderRadius:10,transition:'width 0.4s'}})
        )
        , React.createElement('div', {style:{display:'flex',gap:20,marginTop:12,flexWrap:'wrap'}}
          , verProjeto.data_inicio && React.createElement('span',{style:{fontSize:12,color:'#64748b'}},
              '📅 Início: '+verProjeto.data_inicio.slice(0,10))
          , verProjeto.data_fim_prevista && React.createElement('span',{style:{fontSize:12,color:'#64748b'}},
              '🏁 Previsão término: '+verProjeto.data_fim_prevista.slice(0,10))
          , verProjeto.valor_previsto && React.createElement('span',{style:{fontSize:12,color:'#64748b'}},
              '💰 Valor previsto: '+brl(verProjeto.valor_previsto))
          , verProjeto.responsavel && React.createElement('span',{style:{fontSize:12,color:'#64748b'}},
              '👤 '+verProjeto.responsavel)
        )
      )

      // Etapas
      , React.createElement('div', {style:{background:'#fff',borderRadius:14,border:'1px solid #dce3f0',padding:'16px 20px'}}
        , React.createElement('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}
          , React.createElement('h3', {style:{margin:0,fontWeight:700,color:'#0f2044'}}, '📋 Etapas')
          , React.createElement('button', {onClick:()=>setModalEtapa(true),
              style:{background:'#0f2044',color:'#c8a84b',border:'none',borderRadius:8,
                     padding:'5px 14px',fontSize:12,fontWeight:700,cursor:'pointer'}}, '+ Etapa')
        )
        , loadingDet
          ? React.createElement('p',{style:{color:'#94a3b8',textAlign:'center'}},'Carregando...')
          : etapas.length === 0
            ? React.createElement('p',{style:{color:'#94a3b8',textAlign:'center',padding:20}},'Nenhuma etapa cadastrada')
            : etapas.map((et,i) =>
                React.createElement('div', {key:et.id, style:{
                    display:'flex',alignItems:'flex-start',gap:12,padding:'10px 0',
                    borderBottom: i<etapas.length-1?'1px solid #f1f5f9':'none'}}

                      et.status==='Concluída'?React.createElement('span',{style:{color:'#fff',fontSize:12,fontWeight:900}},'✓'):'')
                  , React.createElement('div', {style:{flex:1}}
                    , React.createElement('div', {style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}
                      , React.createElement('span', {style:{fontWeight:600,fontSize:14,
                          textDecoration:et.status==='Concluída'?'line-through':'none',
                          color:et.status==='Concluída'?'#94a3b8':'#1e293b'}}, et.nome)
                      , React.createElement('span', {style:{fontSize:11,background:'#f1f5f9',
                          color:'#64748b',borderRadius:6,padding:'1px 6px'}},
                          et.tipo==='paralela'?'⇉ Paralela':'→ Sequencial')
                      , et._atraso>0 && et.tipo!=='paralela' && et.status!=='Concluída' &&
                          React.createElement('span',{style:{fontSize:11,color:'#dc2626',fontWeight:700}},'⚠️ +'+et._atraso+'d')
                    )
                    , React.createElement('div', {style:{fontSize:11,color:'#94a3b8',marginTop:3}}
                      , et._inicio_calc && React.createElement('span',{},'📅 '+et._inicio_calc+' → '+et._fim_calc)
                      , React.createElement('span',{style:{marginLeft:8}},'('+et.duracao_dias+'d previstos)')
                    )
                  )
                )
              )
      )

      // Diário de Bordo
      , React.createElement('div', {style:{background:'#fff',borderRadius:14,border:'1px solid #dce3f0',padding:'16px 20px'}}
        , React.createElement('h3', {style:{margin:'0 0 14px',fontWeight:700,color:'#0f2044'}}, '📓 Diário de Bordo')

function Fornecedores({condos, forn, setForn, sel, user, isAdmin, manutencoes}) {
  const TIPOS_SERVICO = ["Elétrico","Hidráulico","Limpeza","Segurança","Jardinagem","Elevador","Pintura","Informática","Contabilidade","Advocacia","Administração","Outros"];
  const blank = {condo_id:sel?.id||"",nome:"",documento:"",tipo_documento:"CNPJ",tipo_servico:"",telefone:"",email:"",condicao_pagamento:"",avaliacao:3,obs:""};
  const [form,    setForm]    = useState({...blank});
  const [erros,   setErros]   = useState({});
  const [modal,   setModal]   = useState(false);
  const [saving,  setSaving]  = useState(false);
  const [busca,   setBusca]   = useState("");
  const [filtroTipo, setFiltroTipo] = useState("todos");
  const [pagina,  setPagina]  = useState(1);
  const POR_PAG = 20;

  const dados = forn
    .filter(f => !sel || f.condo_id === sel.id)
    .filter(f => filtroTipo === "todos" || f.tipo_servico === filtroTipo)
    .filter(f => !busca || f.nome.toLowerCase().includes(busca.toLowerCase()) || (f.documento||"").includes(busca));
  
  // Nome do condomínio para exibição na lista
  const condoNome = (cid) => condos.find(cd=>cd.id===cid)?.nome || '';

  const paginados = dados.slice((pagina-1)*POR_PAG, pagina*POR_PAG);

  // Contagem de manutenções por fornecedor
  const manPorForn = {};
  (manutencoes||[]).forEach(m => {
    if (m.fornecedor) {
      const key = m.fornecedor.trim().toLowerCase();
      manPorForn[key] = (manPorForn[key]||0)+1;
    }
  });

  const validate = () => {
    const e = {};
    if (!form.nome?.trim())    e.nome = "Nome é obrigatório";
    if (!form.condo_id)        e.condo_id = "Selecione o condomínio";
    setErros(e);
    return Object.keys(e).length === 0;
  };

  const save_ = async () => {
    if (!validate()) return;
    setSaving(true);
    try {
      const payload = {
        nome: form.nome.trim(), documento: form.documento||null,
        tipo_documento: form.tipo_documento||"CNPJ", tipo_servico: form.tipo_servico||null,
        telefone: form.telefone||null, email: form.email||null,
        condicao_pagamento: form.condicao_pagamento||null,
        avaliacao: Number(form.avaliacao||3), obs: form.obs||null,
        condo_id: form.condo_id||null, owner_id: user.id, ativo: true,
      };
      if (form.id) {
        const {data,error} = await db.updForn(form.id, payload);
        if (error) throw error;
        setForn(p => p.map(x => x.id===form.id ? data : x));
      } else {
        const {data,error} = await db.addForn(payload);
        if (error) throw error;
        setForn(p => [...p, data]);
      }
      setModal(false);
    } catch(err) { alert("Erro ao salvar: "+err.message); }
    finally { setSaving(false); }
  };

  const del_ = async (id) => {
    if (!confirm("Excluir este fornecedor?")) return;
    await db.delForn(id);
    setForn(p => p.filter(x => x.id !== id));
  };

  const estrelas = (n) => "⭐".repeat(n) + "☆".repeat(5-n);
  const brl = v => "R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2});

    React.createElement('div', {className:"space-y-4"}

            onChange:e=>{setBusca(e.target.value);setPagina(1);}})

          , React.createElement('option',{value:"todos"},"Todos os tipos")
          , TIPOS_SERVICO.map(t => React.createElement('option',{key:t,value:t},t))
        )
      )

      , React.createElement(Card, {}

    if (diff <= 7)  return {label:diff+"d",     cor:"#a16207", bg:"#fef9c3"};

// ── NotificationPopup ────────────────────────────────────────────────────────
function NotificationPopup({notifs, notifIdx, setNotifIdx, setNotifs}) {
  if (!notifs || notifs.length === 0) return null;
  const ev = notifs[notifIdx];
  if (!ev) return null;

  const total   = notifs.length;
  const isLast  = notifIdx >= total - 1;

  const fmtData = (d) => {
    if (!d) return '';
    const dt = new Date(d + 'T00:00:00');
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const diff = Math.ceil((dt - hoje) / 86400000);
    if (diff < 0)  return d.slice(0,10) + ' (Vencido!)';
    if (diff === 0) return 'Hoje!';
    if (diff === 1) return 'Amanhã';
    return d.slice(0,10) + ' (em ' + diff + ' dias)';
  };

  const fechar = () => {
    if (isLast) setNotifs([]);
    else setNotifIdx(i => i + 1);
  };

  const ignorar = () => {
    notifDismiss(ev.id);
    fechar();
  };

  const snooze = (ms, label) => {
    notifSetSnooze(ev.id, ms);
    fechar();
  };

  const snoozeOpts = [
    {label:'5 min',  ms: 5*60*1000},
    {label:'30 min', ms: 30*60*1000},
    {label:'1 hora', ms: 60*60*1000},
    {label:'3 horas',ms: 3*60*60*1000},
    {label:'1 dia',  ms: 24*60*60*1000},
    {label:'3 dias', ms: 3*24*60*60*1000},
  ];

  const vencido = ev.data && new Date(ev.data+'T00:00:00') < new Date();

  return React.createElement('div', {
    style:{position:'fixed',top:0,left:0,right:0,bottom:0,
           background:'rgba(15,32,68,0.55)',zIndex:9999,
           display:'flex',alignItems:'center',justifyContent:'center',padding:16}
  }
    , React.createElement('div', {style:{
        background:'#fff',borderRadius:16,maxWidth:440,width:'100%',
        boxShadow:'0 20px 60px rgba(15,32,68,0.3)',
        border:'1px solid #dce3f0', overflow:'hidden'
      }}
      // Header colorido
      , React.createElement('div', {style:{background:ev.cor||'#0f2044',padding:'16px 20px',
          display:'flex',alignItems:'center',justifyContent:'space-between'}}
        , React.createElement('div', {}
          , React.createElement('p', {style:{margin:0,fontSize:11,fontWeight:700,color:'rgba(255,255,255,0.7)',textTransform:'uppercase',letterSpacing:1}}, ev.tipo)
          , React.createElement('p', {style:{margin:'4px 0 0',fontSize:15,fontWeight:700,color:'#fff',lineHeight:1.3}}, ev.titulo)
        )
        , total > 1 && React.createElement('span', {style:{
            background:'rgba(255,255,255,0.2)',color:'#fff',
            borderRadius:20,padding:'3px 10px',fontSize:11,fontWeight:700,whiteSpace:'nowrap'
          }}, notifIdx+1+'/'+total)
      )
      // Corpo
      , React.createElement('div', {style:{padding:'16px 20px'}}
        , React.createElement('div', {style:{
            background: vencido?'#fee2e2':'#fef9c3',
            borderRadius:10,padding:'10px 14px',marginBottom:14,
            border:'1px solid '+(vencido?'#fecaca':'#fde68a')
          }}
          , React.createElement('p', {style:{margin:0,fontSize:13,fontWeight:700,
              color:vencido?'#dc2626':'#a16207'}},
              '📅 '+fmtData(ev.data))
          , ev.detalhe && React.createElement('p', {style:{margin:'4px 0 0',fontSize:12,color:'#64748b'}}, ev.detalhe)
        )
        // Lembrar em:
        , React.createElement('p', {style:{margin:'0 0 8px',fontSize:11,fontWeight:700,color:'#64748b',textTransform:'uppercase',letterSpacing:1}}, '⏰ Lembrar em:')
        , React.createElement('div', {style:{display:'flex',flexWrap:'wrap',gap:6,marginBottom:14}}
          , snoozeOpts.map(({label, ms}) =>
              React.createElement('button', {key:label, onClick:()=>snooze(ms,label),
                style:{background:'#f1f5f9',color:'#334155',border:'1px solid #dce3f0',
                       borderRadius:8,padding:'5px 12px',fontSize:12,fontWeight:600,cursor:'pointer'}},
                label)
            )
        )
        // Ações
        , React.createElement('div', {style:{display:'flex',gap:8,borderTop:'1px solid #f1f5f9',paddingTop:14}}
          , React.createElement('button', {onClick:ignorar,
              style:{flex:1,background:'#fee2e2',color:'#dc2626',border:'none',borderRadius:10,
                     padding:'9px 0',fontSize:13,fontWeight:700,cursor:'pointer'}},
              '🔕 Não lembrar mais')
          , React.createElement('button', {onClick:fechar,
              style:{flex:1,background:'#0f2044',color:'#c8a84b',border:'none',borderRadius:10,
                     padding:'9px 0',fontSize:13,fontWeight:700,cursor:'pointer'}},
              isLast ? '✓ Fechar' : 'Próxima →')
        )
      )
    )
  );
}

// ── Calendário ─────────────────────────────────────────────────────────────────
function Calendario({condos, cal, setCal, sel, user, isAdmin, manutencoes, fin, inadimplencia, ocorrencias, jur}) {
  const TIPO_COR = { Evento:"#1d4ed8", Tarefa:"#c8a84b", Lembrete:"#9333ea", "Manutenção":"#b45309", Feriado:"#dc2626" };
  const TIPO_ICON = { Evento:"📅", Tarefa:"✅", Lembrete:"🔔", "Manutenção":"🔧", Feriado:"🎉" };
  const STATUS_OPTS = ["Pendente","Concluído","Cancelado"];
  const PRIO_OPTS   = ["Baixa","Normal","Alta","Urgente"];
  const PRIO_COR    = { Baixa:"#64748b", Normal:"#1d4ed8", Alta:"#a16207", Urgente:"#dc2626" };

  const hoje = new Date();
  const [view,     setView]    = useState("mensal");
  const [mesAtual, setMes]     = useState(hoje.getMonth());
  const [anoAtual, setAno]     = useState(hoje.getFullYear());
  const [modal,    setModal]   = useState(false);
  const [form,     setForm]    = useState({});
  const [saving,   setSaving]  = useState(false);
  const [filtroTipo, setFTipo] = useState("todos");
  const [errosCal, setErrosCal] = useState({});

  const blank = { titulo:"", descricao:"", tipo:"Evento", data_inicio:"", data_fim:"",
    hora_inicio:"", status:"Pendente", prioridade:"Normal", delegado_para:"", cor:"#0f2044",
    condo_id: sel?.id || condos[0]?.id || "" };

  // Filtra por condomínio selecionado
  // ── Feriados Nacionais ──────────────────────────────────────────────────────
  const calcPascoa = (ano) => {
    const a=ano%19, b=Math.floor(ano/100), cc=ano%100;
    const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
    const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
    const i=Math.floor(cc/4), k=cc%4, l=(32+2*e+2*i-h-k)%7;
    const m=Math.floor((a+11*h+22*l)/451);
    const mes=Math.floor((h+l-7*m+114)/31);
    const dia=((h+l-7*m+114)%31)+1;
    return new Date(ano, mes-1, dia);
  };
  const addDias = (d,n) => { const r=new Date(d); r.setDate(r.getDate()+n); return r; };
  const fmtD   = (d)   => d.toISOString().slice(0,10);

  const feriadosNacionais = (ano) => {
    const p = calcPascoa(ano);
    return [
      {data:`${ano}-01-01`, nome:"🎆 Confraternização Universal"},
      {data:fmtD(addDias(p,-48)), nome:"🎉 Carnaval (segunda)"},
      {data:fmtD(addDias(p,-47)), nome:"🎉 Carnaval (terça)"},
      {data:fmtD(addDias(p,-2)),  nome:"✝️ Sexta-Feira Santa"},

function AdminPanel({clientes, setClientes, user, condos}) {
  const [modal,   setModal]   = useState(false);
  const [form,    setForm]    = useState({});
  const [saving,  setSaving]  = useState(false);
  const [filtro,  setFiltro]  = useState("todos");
  const [busca,   setBusca]   = useState("");
  const [tabDetalhe, setTabDetalhe] = useState(null);

  const hoje = new Date().toISOString().slice(0,10);

  const blank = {
    nome:"", email:"", telefone:"", cpf_cnpj:"", endereco:"",
    status:"pendente",
    plano:"profissional",
    valor_mensalidade:"", dia_vencimento:"10",
    tipo_contrato:"anual",
    data_inicio_contrato: hoje, data_fim_contrato:"",
    primeira_mensalidade_paga: false,
    trial_ativo:false, trial_inicio:"", trial_fim:"", trial_dias:5,
    obs:""
  };

  // Calcular data fim automaticamente (anual ou mensal)
  const calcFim = (inicio, tipo) => {
    if (!inicio) return "";
    const d = new Date(inicio);
    tipo === "anual" ? d.setFullYear(d.getFullYear()+1) : d.setMonth(d.getMonth()+1);
    return d.toISOString().slice(0,10);
  };

  // Trial helpers
  const ativarTrial = (dias) => {
    const inicio = new Date().toISOString().slice(0,10);
    const fim = new Date(Date.now() + dias*86400000).toISOString().slice(0,10);
    setForm(p=>({...p, trial_ativo:true, trial_inicio:inicio, trial_fim:fim, trial_dias:dias, status:"ativo"}));
  };
  const trialStatus = (cli) => {
    if (!cli.trial_ativo) return null;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const fim  = new Date(cli.trial_fim + 'T00:00:00');
    const diff = Math.ceil((fim - hoje) / 86400000);
    if (diff < 0)  return {label:"Trial expirado",  cor:"#dc2626", bg:"#fee2e2"};
    if (diff === 0) return {label:"Expira hoje!",    cor:"#dc2626", bg:"#fee2e2"};
    if (diff <= 2)  return {label:`Trial: ${diff}d`, cor:"#a16207", bg:"#fef9c3"};
    return              {label:`Trial: ${diff}d`,    cor:"#15803d", bg:"#dcfce7"};
  };

  const lista = clientes
    .filter(c => filtro==="todos" || c.status===filtro)
    .filter(c => !busca || (c.nome||"").toLowerCase().includes(busca.toLowerCase())
      || (c.email||"").toLowerCase().includes(busca.toLowerCase()));

  // KPIs
  const ativos   = clientes.filter(c=>c.status==="ativo").length;
  const inativos = clientes.filter(c=>c.status==="inativo").length;
  const pendentes= clientes.filter(c=>c.status==="pendente").length;
  const suspensos= clientes.filter(c=>c.status==="suspenso").length;
  const mrr = clientes.filter(c=>c.status==="ativo").reduce((s,c)=>s+Number(c.valor_mensalidade||0),0);
  // F4: totais financeiros
  const totalPrevisto = clientes.filter(c=>c.status==="ativo").reduce((s,c)=>s+Number(c.valor_mensalidade||0),0);
  const totalPago     = clientes.filter(c=>c.status==="ativo"&&c.primeira_mensalidade_paga).reduce((s,c)=>s+Number(c.valor_mensalidade||0),0);
  const totalPendADM  = clientes.filter(c=>c.status==="ativo"&&!c.primeira_mensalidade_paga).reduce((s,c)=>s+Number(c.valor_mensalidade||0),0);
  const arr           = mrr * 12;

  const openNew  = () => { setForm({...blank, data_fim_contrato: calcFim(hoje,"anual")}); setModal(true); };
  const openEdit = (c)  => { setForm({...c}); setModal(true); };

  const save_ = async () => {
    if(!form.nome||!form.email) return;
    setSaving(true);
    // Auto-ativar se primeira mensalidade paga
    const status = form.primeira_mensalidade_paga ? "ativo" : (form.status==="ativo" ? "ativo" : form.status||"pendente");
    const payload = {...form, status,
      data_fim_contrato: form.data_fim_contrato || calcFim(form.data_inicio_contrato, form.tipo_contrato),
      valor_mensalidade: Number(form.valor_mensalidade||0),
      dia_vencimento: Number(form.dia_vencimento||10),
      trial_ativo: form.trial_ativo||false,
      trial_inicio: form.trial_inicio||null,
      trial_fim: form.trial_fim||null,
      trial_dias: Number(form.trial_dias||5),
    };
    if(form.id) {
      const {data} = await db.updCliente(form.id, payload);
      setClientes(p=>p.map(c=>c.id===form.id?data:c));
    } else {
      const {data} = await db.addCliente({...payload, owner_id: user.id});
      setClientes(p=>[data,...p]);

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, errorInfo: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };

  render() {
