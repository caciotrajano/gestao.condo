// ── Perfil do Usuário ──────────────────────────────────────────────────────────
function Perfil({user, setUser, clienteInfo, isAdmin}) {
  const [nome,     setNome]     = useState(user?.user_metadata?.nome || '');
  const [telefone, setTelefone] = useState(user?.user_metadata?.telefone || '');
  const [cargo,    setCargo]    = useState(user?.user_metadata?.cargo || '');
  const [senhaAtual,   setSenhaAtual]   = useState('');
  const [senhaNova,    setSenhaNova]    = useState('');
  const [senhaConf,    setSenhaConf]    = useState('');
  const [msgDados, setMsgDados] = useState(null);
  const [msgSenha, setMsgSenha] = useState(null);
  const [saving,   setSaving]   = useState(false);
  const [savingS,  setSavingS]  = useState(false);

  const alert_ = (setter, t, tp='ok') => { setter({t, tp}); setTimeout(()=>setter(null), 4000); };

  const salvarDados = async () => {
    if (!nome) return alert_(setMsgDados, 'Nome é obrigatório.', 'err');
    setSaving(true);
    try {
      const { data, error } = await Promise.race([
        sb.auth.updateUser({ data: { nome, telefone, cargo } }),
        new Promise((_,rej) => setTimeout(()=>rej(new Error('Tempo esgotado')), 8000))
      ]);
      if (error) { alert_(setMsgDados, error.message, 'err'); }
      else { setUser(data.user); alert_(setMsgDados, 'Dados atualizados com sucesso!'); }
    } catch(e) {
      alert_(setMsgDados, e.message, 'err');
    } finally {
      setSaving(false);
    }
  };

  const salvarSenha = async () => {
    if (!senhaNova) return alert_(setMsgSenha, 'Informe a nova senha.', 'err');
    if (senhaNova.length < 6) return alert_(setMsgSenha, 'Senha: mínimo 6 caracteres.', 'err');
    if (senhaNova !== senhaConf) return alert_(setMsgSenha, 'As senhas não conferem.', 'err');
    setSavingS(true);
    try {
      const { error } = await Promise.race([
        sb.auth.updateUser({ password: senhaNova }),
        new Promise((_,rej) => setTimeout(()=>rej(new Error('Tempo esgotado')), 8000))
      ]);
      if (error) { alert_(setMsgSenha, error.message, 'err'); }
      else { setSenhaAtual(''); setSenhaNova(''); setSenhaConf(''); alert_(setMsgSenha, 'Senha alterada com sucesso!'); }
    } catch(e) {
      alert_(setMsgSenha, e.message, 'err');
    } finally {
      setSavingS(false);
    }
  };

  const Msg = ({msg}) => msg ? React.createElement('div', {style:{padding:'10px 14px',borderRadius:10,fontSize:13,fontWeight:500,marginBottom:12,background:msg.tp==='err'?'#fef2f2':'#f0fdf4',color:msg.tp==='err'?'#dc2626':'#16a34a',border:`1px solid ${msg.tp==='err'?'#fecaca':'#bbf7d0'}`}}, msg.t) : null;

  return (
    React.createElement('div', {style:{maxWidth:700,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}
      , React.createElement('div', {}
        , React.createElement('h2', {style:{fontFamily:'Playfair Display,serif',color:'#0f2044',fontSize:22,margin:'0 0 4px'}}, 'Meu Perfil')
        , React.createElement('p', {style:{color:'#64748b',fontSize:13,margin:0}}, user?.email)
      )

      /* Card de plano */
      , React.createElement('div', {style:{background:"linear-gradient(135deg,#0f2044,#1a3260)",borderRadius:14,
          padding:20,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}
        , React.createElement('div', {}
          , React.createElement('p',{style:{margin:"0 0 2px",fontSize:10,fontWeight:700,
              color:"rgba(200,168,75,0.6)",textTransform:"uppercase",letterSpacing:1}},"Seu Plano")
          , React.createElement('p',{style:{margin:"0 0 4px",fontSize:24,fontWeight:800,
              color:"#c8a84b",fontFamily:"Playfair Display,serif"}},
              isAdmin ? "Administrador" : getPlano(clienteInfo?.plano).label)
          , React.createElement('p',{style:{margin:0,fontSize:13,color:"rgba(255,255,255,0.65)"}},
              isAdmin ? "Acesso total · Todos os clientes"
              : getPlano(clienteInfo?.plano).condominios===999
                ? "Condomínios ilimitados"
                : "Até "+getLimiteCondo(clienteInfo)+" condomínio(s)")
        )
        , React.createElement('div',{style:{textAlign:"right"}}
          , clienteInfo?.data_fim_contrato && React.createElement('p',{style:{margin:"0 0 2px",fontSize:11,
              color:"rgba(200,168,75,0.7)",fontWeight:600}},"Contrato até")
          , clienteInfo?.data_fim_contrato && React.createElement('p',{style:{margin:"0 0 8px",fontSize:16,
              fontWeight:800,color:"#c8a84b"}},
              new Date(clienteInfo.data_fim_contrato+"T00:00:00").toLocaleDateString("pt-BR"))
          , clienteInfo?.valor_mensalidade && React.createElement('p',{style:{margin:0,fontSize:12,
              color:"rgba(255,255,255,0.5)"}},
              "Mensalidade: "+Number(clienteInfo.valor_mensalidade).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}))
        )
      )

      /* Avatar + info */
      , React.createElement('div', {className:"perfil-header", style:{background:'white',borderRadius:14,padding:20,boxShadow:'0 2px 10px rgba(15,32,68,0.07)',border:'1px solid #dce3f0'}}
        , React.createElement('div', {style:{width:72,height:72,borderRadius:'50%',background:'linear-gradient(135deg,#c8a84b,#e8c96b)',display:'flex',alignItems:'center',justifyContent:'center',color:'#0f2044',fontWeight:800,fontSize:28,flexShrink:0}}, (nome||user?.email||'U')[0].toUpperCase())
        , React.createElement('div', {}
          , React.createElement('p', {style:{fontWeight:700,fontSize:18,color:'#0f2044',margin:'0 0 2px',fontFamily:'Playfair Display,serif'}}, nome||'Sem nome')
          , React.createElement('p', {style:{color:'#64748b',fontSize:13,margin:'0 0 2px'}}, user?.email)
          , cargo && React.createElement('p', {style:{color:'#c8a84b',fontSize:12,fontWeight:600,margin:0}}, cargo)
        )
      )

      /* Dados cadastrais */
      , React.createElement('div', {style:{background:'white',borderRadius:14,padding:24,boxShadow:'0 2px 10px rgba(15,32,68,0.07)',border:'1px solid #dce3f0'}}
        , React.createElement('h3', {style:{fontFamily:'Playfair Display,serif',color:'#0f2044',fontSize:16,margin:'0 0 16px',paddingBottom:10,borderBottom:'1px solid #f1f5f9'}}, '👤 Dados Cadastrais')
        , React.createElement(Msg, {msg:msgDados})
        , React.createElement('div', {className:"grid-2col", style:{}}
          , React.createElement(F, {label:'Nome completo'}, React.createElement(Inp, {value:nome, onChange:e=>setNome(e.target.value), placeholder:'Seu nome'}))
          , React.createElement(F, {label:'E-mail'}, React.createElement(Inp, {value:user?.email||'', disabled:true, style:{opacity:0.6,cursor:'not-allowed'}}))
          , React.createElement(F, {label:'Telefone'}, React.createElement(Inp, {value:telefone, onChange:e=>setTelefone(e.target.value), placeholder:'(00) 00000-0000'}))
          , React.createElement(F, {label:'Cargo/Função'}, React.createElement(Inp, {value:cargo, onChange:e=>setCargo(e.target.value), placeholder:'Ex: Síndico Profissional'}))
        )
        , React.createElement('div', {style:{display:'flex',justifyContent:'flex-end',marginTop:16}}
          , React.createElement(Btn, {onClick:salvarDados, disabled:saving}, saving?'Salvando...':'💾 Salvar Dados')
        )
      )

      /* Alterar senha */
      , React.createElement('div', {style:{background:'white',borderRadius:14,padding:24,boxShadow:'0 2px 10px rgba(15,32,68,0.07)',border:'1px solid #dce3f0'}}
        , React.createElement('h3', {style:{fontFamily:'Playfair Display,serif',color:'#0f2044',fontSize:16,margin:'0 0 16px',paddingBottom:10,borderBottom:'1px solid #f1f5f9'}}, '🔒 Alterar Senha')
        , React.createElement(Msg, {msg:msgSenha})
        , React.createElement('div', {className:"grid-3col", style:{}}
          , React.createElement(F, {label:'Senha atual'}, React.createElement(Inp, {type:'password', value:senhaAtual, onChange:e=>setSenhaAtual(e.target.value), placeholder:'••••••'}))
          , React.createElement(F, {label:'Nova senha'}, React.createElement(Inp, {type:'password', value:senhaNova, onChange:e=>setSenhaNova(e.target.value), placeholder:'••••••'}))
          , React.createElement(F, {label:'Confirmar nova senha'}, React.createElement(Inp, {type:'password', value:senhaConf, onChange:e=>setSenhaConf(e.target.value), placeholder:'••••••'}))
        )
        , React.createElement('div', {style:{display:'flex',justifyContent:'flex-end',marginTop:16}}
          , React.createElement(Btn, {onClick:salvarSenha, disabled:savingS}, savingS?'Alterando...':'🔑 Alterar Senha')
        )
      )
    )
  );
}


// ── PDF Reports ───────────────────────────────────────────────────────────────
const PDF = {
  NAVY: [15, 32, 68],
  GOLD: [200, 168, 75],
  LIGHT: [238, 241, 247],
  WHITE: [255, 255, 255],
  RED: [185, 28, 28],
  GREEN: [21, 128, 61],
  AMBER: [180, 83, 9],
  TEXT: [26, 39, 68],
  MUTED: [100, 116, 139],

  brl(v) { return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0); },
  hoje() { return new Date().toLocaleDateString("pt-BR"); },

  header(doc, titulo, condoNome, subtitulo="") {
    const W = doc.internal.pageSize.width;
    // Faixa Navy
    doc.setFillColor(...PDF.NAVY);
    doc.rect(0, 0, W, 28, "F");
    // Linha dourada
    doc.setFillColor(...PDF.GOLD);
    doc.rect(0, 28, W, 2, "F");
    // Logo lateral
    doc.setFillColor(...PDF.GOLD);
    doc.rect(10, 5, 3, 18, "F");
    // Titulo
    doc.setTextColor(...PDF.WHITE);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("Portal do Síndico", 17, 13);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(180, 190, 210);
    doc.text("PROFISSIONAL", 17, 19);
    // Título do relatório
    doc.setTextColor(...PDF.WHITE);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(13);
    doc.text(titulo, W/2, 13, {align:"center"});
    if (subtitulo) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(180, 190, 210);
      doc.text(subtitulo, W/2, 20, {align:"center"});
    }
    // Data e condomínio
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(180, 190, 210);
    doc.text(`${condoNome}  |  Gerado em ${PDF.hoje()}`, W-12, 13, {align:"right"});
    doc.text("Cácio Trajano — Portal do Síndico", W-12, 20, {align:"right"});
  },

  footer(doc) {
    const W = doc.internal.pageSize.width;
    const H = doc.internal.pageSize.height;
    const pages = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFillColor(...PDF.NAVY);
      doc.rect(0, H-10, W, 10, "F");
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7);
      doc.setTextColor(...PDF.GOLD);
      doc.text("Portal do Síndico Profissional  |  Documento gerado automaticamente", 12, H-4);
      doc.setTextColor(180,190,210);
      doc.text(`Página ${i} de ${pages}`, W-12, H-4, {align:"right"});
    }
  },

  kpiBox(doc, x, y, w, h, label, value, color) {
    doc.setFillColor(...color);
    doc.roundedRect(x, y, w, h, 2, 2, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(7);
    doc.setTextColor(...PDF.WHITE);
    doc.text(label.toUpperCase(), x+w/2, y+5, {align:"center"});
    doc.setFontSize(11);
    doc.text(value, x+w/2, y+12, {align:"center"});
  },

  sectionTitle(doc, text, y) {
    const W = doc.internal.pageSize.width;
    doc.setFillColor(...PDF.LIGHT);
    doc.rect(10, y, W-20, 8, "F");
    doc.setFillColor(...PDF.GOLD);
    doc.rect(10, y, 3, 8, "F");
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(...PDF.NAVY);
    doc.text(text, 16, y+5.5);
    return y + 10;
  },

  // ── RELATÓRIO FINANCEIRO SINTÉTICO ─────────────────────────────────────────
  financSintetico(condoNome, fin, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const W = doc.internal.pageSize.width;
    const dados = sel ? fin.filter(f=>f.condo_id===sel.id) : fin;

    PDF.header(doc, "RELATÓRIO FINANCEIRO SINTÉTICO", condoNome);
    let y = 36;

    // KPIs principais
    const rec = dados.filter(f=>f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);
    const dep = dados.filter(f=>f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
    const saldo = rec - dep;
    const pago  = dados.filter(f=>f.status==="Pago").reduce((s,f)=>s+Number(f.valor||0),0);
    const emAberto = dados.filter(f=>f.status==="Em aberto"&&f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);

    PDF.kpiBox(doc, 10, y, 37, 18, "Total Receitas", PDF.brl(rec), PDF.GREEN);
    PDF.kpiBox(doc, 50, y, 37, 18, "Total Despesas", PDF.brl(dep), PDF.RED);
    PDF.kpiBox(doc, 90, y, 37, 18, "Saldo", PDF.brl(saldo), saldo>=0 ? PDF.NAVY : PDF.RED);
    PDF.kpiBox(doc, 130, y, 37, 18, "Valores Pagos", PDF.brl(pago), [15, 118, 110]);
    PDF.kpiBox(doc, 170, y, 27, 18, "A Receber", PDF.brl(emAberto), PDF.AMBER);
    y += 24;

    // Saúde Financeira
    y = PDF.sectionTitle(doc, "SAÚDE FINANCEIRA", y);
    const pctDep = rec > 0 ? (dep/rec*100).toFixed(1) : 0;
    const situacao = saldo >= 0 ? "SUPERÁVIT" : "DÉFICIT";
    const corSit = saldo >= 0 ? [21,128,61] : [185,28,28];
    doc.setFillColor(...PDF.WHITE);
    doc.setDrawColor(...PDF.LIGHT);
    doc.roundedRect(10, y, W-20, 24, 2, 2, "FD");
    doc.setFont("helvetica","bold"); doc.setFontSize(10);
    doc.setTextColor(...corSit);
    doc.text(`Situação: ${situacao}`, 16, y+8);
    doc.setFont("helvetica","normal"); doc.setFontSize(9);
    doc.setTextColor(...PDF.TEXT);
    doc.text(`Índice de comprometimento de despesas: ${pctDep}% das receitas`, 16, y+16);
    const rating = pctDep < 60 ? "Excelente" : pctDep < 80 ? "Boa" : pctDep < 100 ? "Atenção" : "Crítica";
    doc.setFont("helvetica","bold");
    doc.setTextColor(pctDep < 80 ? PDF.GREEN[0] : PDF.RED[0], pctDep < 80 ? PDF.GREEN[1] : PDF.RED[1], pctDep < 80 ? PDF.GREEN[2] : PDF.RED[2]);
    doc.text(`Classificação: ${rating}`, 130, y+8);
    y += 28;

    // Resumo por mês
    y = PDF.sectionTitle(doc, "RESUMO MENSAL", y);
    const meses = [...new Set(dados.map(f=>f.mes))].filter(Boolean);
    const tabelaMeses = meses.map(m => {
      const r = dados.filter(f=>f.mes===m&&f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);
      const d = dados.filter(f=>f.mes===m&&f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
      return [m, PDF.brl(r), PDF.brl(d), PDF.brl(r-d)];
    });
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Mês","Receitas","Despesas","Saldo"]],
      body: tabelaMeses,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
      bodyStyles:{fontSize:8, textColor:PDF.TEXT},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right"}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===3) {
          const v = tabelaMeses[data.row.index]?.[3]||"";
          data.cell.styles.textColor = v.includes("-") ? PDF.RED : PDF.GREEN;
          data.cell.styles.fontStyle = "bold";
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    // Resumo por categoria
    y = PDF.sectionTitle(doc, "DESPESAS POR CATEGORIA", y);
    const cats = [...new Set(dados.filter(f=>f.tipo==="Despesa").map(f=>f.categoria))].filter(Boolean);
    const tabCat = cats.map(c=>{
      const tot = dados.filter(f=>f.categoria===c&&f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
      const pct = dep > 0 ? (tot/dep*100).toFixed(1)+"%" : "0%";
      return [c, PDF.brl(tot), pct];
    }).sort((a,b)=>b[1].localeCompare(a[1]));
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Categoria","Total","% do Total"]],
      body: tabCat,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
      bodyStyles:{fontSize:8},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{1:{halign:"right"},2:{halign:"center"}},
    });

    PDF.footer(doc);
    doc.save(`relatorio-sintetico-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },

  // ── RELATÓRIO FINANCEIRO ANALÍTICO ─────────────────────────────────────────
  financAnalitico(condoNome, fin, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
    const dados = sel ? fin.filter(f=>f.condo_id===sel.id) : fin;

    PDF.header(doc, "RELATÓRIO FINANCEIRO ANALÍTICO", condoNome, "Todos os lançamentos detalhados");
    let y = 36;

    const rec = dados.filter(f=>f.tipo==="Receita").reduce((s,f)=>s+Number(f.valor||0),0);
    const dep = dados.filter(f=>f.tipo==="Despesa").reduce((s,f)=>s+Number(f.valor||0),0);
    PDF.kpiBox(doc, 10, y, 55, 16, "Receitas", PDF.brl(rec), PDF.GREEN);
    PDF.kpiBox(doc, 70, y, 55, 16, "Despesas", PDF.brl(dep), PDF.RED);
    PDF.kpiBox(doc, 130, y, 55, 16, "Saldo", PDF.brl(rec-dep), rec-dep>=0?PDF.NAVY:PDF.RED);
    PDF.kpiBox(doc, 190, y, 55, 16, "Lançamentos", `${dados.length} registros`, [15,118,110]);
    y += 22;

    // Lançamentos por tipo
    ["Receita","Despesa"].forEach(tipo => {
      const rows = dados.filter(f=>f.tipo===tipo).map(f=>[
        f.data||"", f.mes||"", f.descricao||"", f.categoria||"",
        PDF.brl(f.valor), f.status||"", f.forma_pgto||""
      ]);
      if(!rows.length) return;
      y = PDF.sectionTitle(doc, `LANÇAMENTOS — ${tipo.toUpperCase()}S`, y);
      doc.autoTable({
        startY: y, margin:{left:10,right:10},
        head:[["Data","Mês","Descrição","Categoria","Valor","Status","Forma Pgto"]],
        body: rows,
        headStyles:{fillColor: tipo==="Receita"?PDF.GREEN:PDF.RED, textColor:PDF.WHITE, fontStyle:"bold", fontSize:7},
        bodyStyles:{fontSize:7, textColor:PDF.TEXT},
        alternateRowStyles:{fillColor:PDF.LIGHT},
        columnStyles:{4:{halign:"right",fontStyle:"bold"},0:{cellWidth:20},1:{cellWidth:22},5:{cellWidth:22},6:{cellWidth:22}},
      });
      y = doc.lastAutoTable.finalY + 6;
    });

    PDF.footer(doc);
    doc.save(`relatorio-analitico-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },

  // ── RELATÓRIO INADIMPLÊNCIA ─────────────────────────────────────────────────
  inadimplencia(condoNome, inad, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const dados = sel ? inad.filter(i=>i.condo_id===sel.id) : inad;

    PDF.header(doc, "RELATÓRIO DE INADIMPLÊNCIA", condoNome);
    let y = 36;

    const ativos = dados.filter(i=>i.status==="Inadimplente");
    const acordo = dados.filter(i=>i.status==="Acordo");
    const judicial = dados.filter(i=>i.status==="Ação Judicial");
    const valorTotal = ativos.reduce((s,i)=>s+Number(i.valor||0),0);
    const W = doc.internal.pageSize.width;

    PDF.kpiBox(doc, 10, y, 42, 18, "Inadimplentes", `${ativos.length} unid.`, PDF.RED);
    PDF.kpiBox(doc, 55, y, 42, 18, "Valor em Aberto", PDF.brl(valorTotal), PDF.AMBER);
    PDF.kpiBox(doc, 100, y, 42, 18, "Em Acordo", `${acordo.length} unid.`, [88,28,135]);
    PDF.kpiBox(doc, 145, y, 42, 18, "Ação Judicial", `${judicial.length} unid.`, PDF.NAVY);
    y += 24;

    y = PDF.sectionTitle(doc, "UNIDADES INADIMPLENTES", y);
    const rows = dados.map(i=>[
      i.unidade||"", i.bloco||"", i.morador||"",
      i.mes||"", PDF.brl(i.valor), i.dias_atraso||"0",
      i.status||"", i.notificacoes||"0"
    ]);
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Unidade","Bloco","Morador","Mês Ref.","Valor","Dias","Status","Notif."]],
      body: rows,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
      bodyStyles:{fontSize:8},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{4:{halign:"right",fontStyle:"bold"},5:{halign:"center"},7:{halign:"center"}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===6) {
          const s = rows[data.row.index]?.[6]||"";
          if(s==="Inadimplente") data.cell.styles.textColor=PDF.RED;
          else if(s==="Acordo") data.cell.styles.textColor=[88,28,135];
          else if(s==="Ação Judicial") data.cell.styles.textColor=PDF.AMBER;
          else if(s==="Regularizado") data.cell.styles.textColor=PDF.GREEN;
          data.cell.styles.fontStyle="bold";
        }
      }
    });
    y = doc.lastAutoTable.finalY + 8;

    // Alerta
    if(ativos.length > 0) {
      doc.setFillColor(254,242,242);
      doc.setDrawColor(...PDF.RED);
      doc.roundedRect(10, y, W-20, 14, 2, 2, "FD");
      doc.setFont("helvetica","bold"); doc.setFontSize(9);
      doc.setTextColor(...PDF.RED);
      doc.text(`⚠  Alerta: ${ativos.length} unidade(s) em situação de inadimplência — Total: ${PDF.brl(valorTotal)}`, 16, y+9);
    }

    PDF.footer(doc);
    doc.save(`relatorio-inadimplencia-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },

  // ── RELATÓRIO OCORRÊNCIAS ──────────────────────────────────────────────────
  ocorrencias(condoNome, oco, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
    const dados = sel ? oco.filter(o=>o.condo_id===sel.id) : oco;

    PDF.header(doc, "RELATÓRIO DE OCORRÊNCIAS", condoNome);
    let y = 36;

    const abertas  = dados.filter(o=>o.status==="Aberta").length;
    const andamento= dados.filter(o=>o.status==="Em andamento").length;
    const resolvidas=dados.filter(o=>o.status==="Resolvida"||o.status==="Concluída").length;
    const altas    = dados.filter(o=>o.prioridade==="Alta").length;

    PDF.kpiBox(doc, 10, y, 55, 16, "Abertas", `${abertas}`, PDF.RED);
    PDF.kpiBox(doc, 70, y, 55, 16, "Em Andamento", `${andamento}`, PDF.AMBER);
    PDF.kpiBox(doc, 130, y, 55, 16, "Resolvidas", `${resolvidas}`, PDF.GREEN);
    PDF.kpiBox(doc, 190, y, 55, 16, "Alta Prioridade", `${altas}`, PDF.NAVY);
    y += 22;

    y = PDF.sectionTitle(doc, "REGISTRO DE OCORRÊNCIAS", y);
    const rows = dados.map(o=>[
      o.data||"", o.unidade||"", o.morador||"",
      o.tipo||"", o.prioridade||"", o.status||"",
      o.responsavel||"—",
      (o.descricao||"").substring(0,60)+(o.descricao?.length>60?"...":"")
    ]);
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Data","Unidade","Morador","Tipo","Prior.","Status","Responsável","Descrição"]],
      body: rows,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:7},
      bodyStyles:{fontSize:7},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{0:{cellWidth:20},1:{cellWidth:20},4:{halign:"center"},5:{cellWidth:25}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===5){
          const s=rows[data.row.index]?.[5]||"";
          if(s==="Aberta") data.cell.styles.textColor=PDF.RED;
          else if(s==="Em andamento") data.cell.styles.textColor=PDF.AMBER;
          else if(s==="Resolvida"||s==="Concluída") data.cell.styles.textColor=PDF.GREEN;
          data.cell.styles.fontStyle="bold";
        }
        if(data.section==="body"&&data.column.index===4){
          const s=rows[data.row.index]?.[4]||"";
          if(s==="Alta") data.cell.styles.textColor=PDF.RED;
          else if(s==="Média") data.cell.styles.textColor=PDF.AMBER;
          data.cell.styles.fontStyle="bold";
        }
      }
    });

    PDF.footer(doc);
    doc.save(`relatorio-ocorrencias-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },

  // ── RELATÓRIO MANUTENÇÕES ──────────────────────────────────────────────────
  manutencoes(condoNome, man, sel) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"landscape", unit:"mm", format:"a4"});
    const dados = sel ? man.filter(m=>m.condo_id===sel.id) : man;

    PDF.header(doc, "RELATÓRIO DE MANUTENÇÕES", condoNome);
    let y = 36;

    const concluidas  = dados.filter(m=>m.status==="Concluída");
    const agendadas   = dados.filter(m=>m.status==="Agendada");
    const emExecucao  = dados.filter(m=>m.status==="Em execução");
    const totalGasto  = concluidas.reduce((s,m)=>s+Number(m.valor||0),0);
    const totalPrevi  = dados.reduce((s,m)=>s+Number(m.valor||0),0);

    PDF.kpiBox(doc, 10, y, 55, 16, "Total Gasto", PDF.brl(totalGasto), PDF.NAVY);
    PDF.kpiBox(doc, 70, y, 55, 16, "Previsto/Aberto", PDF.brl(totalPrevi-totalGasto), PDF.AMBER);
    PDF.kpiBox(doc, 130, y, 55, 16, "Concluídas", `${concluidas.length}`, PDF.GREEN);
    PDF.kpiBox(doc, 190, y, 55, 16, "Pendentes", `${agendadas.length+emExecucao.length}`, PDF.RED);
    y += 22;

    y = PDF.sectionTitle(doc, "REGISTRO DE MANUTENÇÕES", y);
    const rows = dados.map(m=>[
      m.data||"", m.tipo||"", m.area||"",
      (m.descricao||"").substring(0,50)+(m.descricao?.length>50?"...":""),
      m.fornecedor||"—", PDF.brl(m.valor),
      m.status||"", m.os||"—"
    ]);
    doc.autoTable({
      startY: y, margin:{left:10,right:10},
      head:[["Data","Tipo","Área","Descrição","Fornecedor","Valor","Status","OS"]],
      body: rows,
      headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:7},
      bodyStyles:{fontSize:7},
      alternateRowStyles:{fillColor:PDF.LIGHT},
      columnStyles:{5:{halign:"right",fontStyle:"bold"},0:{cellWidth:20},1:{cellWidth:22},2:{cellWidth:22},6:{cellWidth:24}},
      didParseCell(data) {
        if(data.section==="body"&&data.column.index===6){
          const s=rows[data.row.index]?.[6]||"";
          if(s==="Concluída") data.cell.styles.textColor=PDF.GREEN;
          else if(s==="Em execução") data.cell.styles.textColor=PDF.AMBER;
          else if(s==="Agendada") data.cell.styles.textColor=PDF.NAVY;
          data.cell.styles.fontStyle="bold";
        }
      }
    });
    y = doc.lastAutoTable.finalY + 6;

    // Resumo por tipo
    if(y < 170) {
      y = PDF.sectionTitle(doc, "RESUMO POR TIPO", y);
      const tipos = [...new Set(dados.map(m=>m.tipo))].filter(Boolean);
      const tabTipos = tipos.map(t=>{
        const it = dados.filter(m=>m.tipo===t);
        const gasto = it.filter(m=>m.status==="Concluída").reduce((s,m)=>s+Number(m.valor||0),0);
        return [t, it.length+"", PDF.brl(gasto)];
      });
      doc.autoTable({
        startY: y, margin:{left:10,right:10}, tableWidth:120,
        head:[["Tipo","Qtd","Total Gasto"]],
        body: tabTipos,
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8},
        alternateRowStyles:{fillColor:PDF.LIGHT},
        columnStyles:{1:{halign:"center"},2:{halign:"right",fontStyle:"bold"}},
      });
    }

    PDF.footer(doc);
    doc.save(`relatorio-manutencoes-${condoNome.replace(/\s/g,"-")}-${PDF.hoje().replace(/\//g,"-")}.pdf`);
  },
};


// ── Ficha do Condômino ────────────────────────────────────────────────────────
function Condomino({condos, financeiro, inadimplencia, ocorrencias, condominos, setCondominos, sel, user}) {
  // ── estados de busca / ficha ──────────────────────────────────────────────
  const [busca,      setBusca]      = useState("");
  const [resultado,  setResultado]  = useState(null);
  const [sugestoes,  setSugestoes]  = useState([]);
  // ── estados do cadastro ───────────────────────────────────────────────────
  const [modal,  setModal]  = useState(false);
  const [form,   setForm]   = useState({});
  const [saving, setSaving] = useState(false);
  const [filtro, setFiltro] = useState("");

  const blankForm = {
    condo_id:"", unidade:"", bloco:"", nome:"", telefone:"", email:"",
    tipo:"Proprietário",
    prop_nome:"", prop_telefone:"",
    imob_nome:"", imob_telefone:""
  };

  // Mescla: cadastrados + derivados da inadimplência (sem duplicata)
  const listaBase = React.useMemo(() => {
    // Moradores já cadastrados na tabela condominos
    const cadastrados = new Set(condominos.map(c => (c.nome||"").toLowerCase()+"_"+(c.condo_id||"")));

    // Derivar da inadimplência quem ainda não foi cadastrado
    const derivados = [];
    inadimplencia.forEach(i => {
      if (!i || !i.morador) return;
      const key = (i.morador||"").toLowerCase()+"_"+(i.condo_id||"");
      if (!cadastrados.has(key)) {
        cadastrados.add(key); // evita duplicata entre registros de inad
        derivados.push({
          id: "__inad__"+i.id,
          condo_id: i.condo_id,
          unidade:  i.unidade||"",
          bloco:    i.bloco||"",
          nome:     i.morador||"",
          telefone: i.telefone||"",
          email:    "",
          tipo:     "Proprietário",
          prop_nome: i.morador||"",
          prop_telefone: i.telefone||"",
          imob_nome: "",
          imob_telefone: "",
          _derivado: true,
        });
      }
    });

    return [...condominos, ...derivados];
  }, [condominos, inadimplencia]);

  // Filtro por condomínio e texto
  const lista = (sel ? listaBase.filter(c=>c.condo_id===sel.id) : listaBase)
    .filter(c => !filtro || (c.nome||"").toLowerCase().includes(filtro.toLowerCase())
      || (c.unidade||"").toLowerCase().includes(filtro.toLowerCase()))
    .sort((a,b)=>(a.unidade||"").localeCompare(b.unidade||"", "pt-BR", {numeric:true}));

  // ── CRUD ──────────────────────────────────────────────────────────────────
  const openNew = () => {
    setForm({...blankForm, condo_id: sel?.id || condos[0]?.id || ""});
    setModal(true);
  };
  const openEdit = (row) => {
    // Se for derivado da inadimplência, abre como novo cadastro pré-preenchido
    if(row._derivado) {
      setForm({...blankForm,
        condo_id: row.condo_id, unidade: row.unidade, bloco: row.bloco,
        nome: row.nome, telefone: row.telefone, tipo: "Proprietário",
        prop_nome: row.nome, prop_telefone: row.telefone,
      });
    } else {
      setForm({...row});
    }
    setModal(true);
  };

  const save_ = async () => {
    if(!form.nome || !form.unidade || !form.condo_id) return;
    setSaving(true);
    const payload = {
      condo_id: form.condo_id, unidade: form.unidade, bloco: form.bloco||"",
      nome: form.nome, telefone: form.telefone||"", email: form.email||"",
      tipo: form.tipo,
      prop_nome: form.tipo==="Proprietário" ? form.nome : (form.prop_nome||""),
      prop_telefone: form.tipo==="Proprietário" ? form.telefone : (form.prop_telefone||""),
      imob_nome: form.imob_nome||"", imob_telefone: form.imob_telefone||""
    };
    if(form.id) {
      const {data} = await db.updCondomino(form.id, payload);
      setCondominos(p => p.map(c => c.id===form.id ? data : c));
    } else {
      const {data} = await db.addCondomino({...payload, owner_id: user.id});
      setCondominos(p => [data, ...p]);
    }
    setSaving(false); setModal(false);
  };

  const del = async (id) => {
    if(!confirm("Remover condômino?")) return;
    await db.delCondomino(id);
    setCondominos(p => p.filter(c => c.id!==id));
  };

  // ── Busca para a ficha individual ─────────────────────────────────────────
  const todosNomes = React.useMemo(() => {
    const set = new Map();
    inadimplencia.forEach(i => {
      if(i && i.morador) {
        const key = i.morador.toLowerCase();
        if(!set.has(key)) set.set(key, {nome:i.morador, unidade:i.unidade, bloco:i.bloco, telefone:i.telefone, condo_id:i.condo_id});
      }
    });
    condominos.forEach(c => {
      if(c && c.nome) {
        const key = c.nome.toLowerCase();
        if(!set.has(key)) set.set(key, {nome:c.nome, unidade:c.unidade, bloco:c.bloco, telefone:c.telefone, condo_id:c.condo_id});
      }
    });
    return Array.from(set.values());
  }, [inadimplencia, condominos]);

  const handleBusca = (v) => {
    setBusca(v); setResultado(null);
    if(v.length < 2) { setSugestoes([]); return; }
    setSugestoes(todosNomes.filter(m => m.nome.toLowerCase().includes(v.toLowerCase())).slice(0, 8));
  };

  const selecionar = (morador) => {
    setBusca(morador.nome); setSugestoes([]);
    const condo = condos.find(c => c.id === morador.condo_id);
    const nomeCondo = condo ? condo.nome : "—";
    const inad = inadimplencia.filter(i => i && i.morador && i.morador.toLowerCase() === morador.nome.toLowerCase());
    const totalInad = inad.filter(i=>i.status==="Inadimplente").reduce((s,i)=>s+Number(i.valor||0),0);
    const totalPago = inad.filter(i=>i.status==="Regularizado").reduce((s,i)=>s+Number(i.valor||0),0);
    const notificacoes = inad.reduce((s,i)=>s+Number(i.notificacoes||0),0);
    const statusAtual = inad.length > 0 ? inad[0].status : "Sem registros";
    const oco = ocorrencias.filter(o => o && o.morador && o.morador.toLowerCase() === morador.nome.toLowerCase());
    const cadastro = condominos.find(c => c.nome && c.nome.toLowerCase() === morador.nome.toLowerCase());
    setResultado({ morador, condo: nomeCondo, inad, oco, totalInad, totalPago, notificacoes, statusAtual, cadastro });
  };

  const corStatus = (s) => {
    if(s==="Inadimplente"||s==="Ação Judicial") return "#dc2626";
    if(s==="Acordo") return "#7c3aed"; if(s==="Regularizado") return "#15803d"; return "#64748b";
  };

  const gerarPDF = () => {
    if(!resultado) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
    const W = doc.internal.pageSize.width;
    PDF.header(doc, "FICHA DO CONDÔMINO", resultado.condo);
    let y = 36;
    doc.setFillColor(238,241,247); doc.roundedRect(10, y, W-20, 30, 3, 3, "F");
    doc.setFillColor(15,32,68); doc.circle(26, y+15, 10, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.setTextColor(255,255,255);
    doc.text(resultado.morador.nome[0].toUpperCase(), 26, y+19, {align:"center"});
    doc.setTextColor(15,32,68); doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text(resultado.morador.nome, 42, y+10);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(100,116,139);
    doc.text(resultado.morador.unidade||"—", 42, y+18);
    doc.text("Condomínio: "+resultado.condo, 42, y+25);
    if(resultado.morador.telefone) doc.text("Tel: "+resultado.morador.telefone, 130, y+18);
    const corR = resultado.statusAtual==="Regularizado"||resultado.statusAtual==="Sem registros" ? [21,128,61] : [185,28,28];
    doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...corR);
    doc.text("Status: "+resultado.statusAtual, 130, y+10);
    y += 36;
    PDF.kpiBox(doc, 10, y, 42, 16, "Em Aberto", PDF.brl(resultado.totalInad), resultado.totalInad>0?PDF.RED:PDF.GREEN);
    PDF.kpiBox(doc, 55, y, 42, 16, "Regularizados", PDF.brl(resultado.totalPago), PDF.GREEN);
    PDF.kpiBox(doc, 100, y, 42, 16, "Notificações", ""+resultado.notificacoes, resultado.notificacoes>1?PDF.RED:PDF.AMBER);
    PDF.kpiBox(doc, 145, y, 42, 16, "Ocorrências", ""+resultado.oco.length, PDF.NAVY);
    y += 22;
    if(resultado.cadastro) {
      y = PDF.sectionTitle(doc, "DADOS CADASTRAIS", y);
      const cd = resultado.cadastro;
      doc.autoTable({
        startY: y, margin:{left:10,right:10},
        head:[["Campo","Informação"]],
        body:[
          ["Tipo", cd.tipo||"—"],
          ["Email", cd.email||"—"],
          ["Telefone", cd.telefone||"—"],
          ["Proprietário", cd.prop_nome||"—"],
          ["Tel. Proprietário", cd.prop_telefone||"—"],
          ["Imobiliária", cd.imob_nome||"Não se aplica"],
          ["Tel. Imobiliária", cd.imob_telefone||"—"],
        ],
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:PDF.LIGHT},
      });
      y = doc.lastAutoTable.finalY + 6;
    }
    if(resultado.inad.length > 0) {
      y = PDF.sectionTitle(doc, "HISTÓRICO FINANCEIRO / INADIMPLÊNCIA", y);
      doc.autoTable({
        startY: y, margin:{left:10,right:10},
        head:[["Mês","Valor","Dias","Status","Notif.","Obs."]],
        body: resultado.inad.map(i=>[i.mes||"",PDF.brl(i.valor),i.dias_atraso||"0",i.status||"",i.notificacoes||"0",i.obs||""]),
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:PDF.LIGHT},
        columnStyles:{1:{halign:"right",fontStyle:"bold"},4:{halign:"center"}},
      });
      y = doc.lastAutoTable.finalY + 6;
    }
    if(resultado.oco.length > 0) {
      y = PDF.sectionTitle(doc, "OCORRÊNCIAS", y);
      doc.autoTable({
        startY: y, margin:{left:10,right:10},
        head:[["Data","Tipo","Prior.","Status","Descrição"]],
        body: resultado.oco.map(o=>[o.data||"",o.tipo||"",o.prioridade||"",o.status||"",(o.descricao||"").substring(0,55)]),
        headStyles:{fillColor:PDF.NAVY, textColor:PDF.WHITE, fontStyle:"bold", fontSize:8},
        bodyStyles:{fontSize:8}, alternateRowStyles:{fillColor:PDF.LIGHT},
      });
    }
    PDF.footer(doc);
    doc.save("ficha-"+resultado.morador.nome.replace(/\s/g,"-")+".pdf");
  };

  // ── helpers de UI ─────────────────────────────────────────────────────────
  const badge = (tipo) => React.createElement('span', {style:{
    background: tipo==="Proprietário" ? "#0f2044" : "#7c3aed",
    color:"white", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700, whiteSpace:"nowrap"
  }}, tipo);

  const tdStyle = (i) => ({padding:"9px 12px", fontSize:12, borderBottom:"1px solid #f1f5f9",
    background: i%2===0 ? "#f8fafc" : "white"});
  const thStyle = {padding:"9px 12px", fontSize:11, fontWeight:700, color:"white",
    background:"#0f2044", textAlign:"left", whiteSpace:"nowrap"};

  // ── render ─────────────────────────────────────────────────────────────────
  return (
    React.createElement('div', {style:{display:"flex",flexDirection:"column",gap:16}}

      // ── Busca de ficha individual ──────────────────────────────────────────
      , React.createElement('div', {style:{background:"white",borderRadius:14,padding:20,
          boxShadow:"0 2px 10px rgba(15,32,68,0.07)",border:"1px solid #dce3f0"}}

        , React.createElement('h2', {style:{margin:"0 0 4px",fontFamily:"Playfair Display,serif",color:"#0f2044",fontSize:18}},
            "🔍 Ficha do Condômino")
        , React.createElement('p', {style:{margin:"0 0 14px",color:"#64748b",fontSize:13}},
            "Pesquise pelo nome para ver o histórico completo")

        // Campo busca
        , React.createElement('div', {style:{position:"relative"}}
          , React.createElement('input', {
              value: busca, onChange: e => handleBusca(e.target.value),
              placeholder: "Digite o nome do condômino...",
              style:{width:"100%",padding:"12px 16px",fontSize:14,borderRadius:10,
                border:"2px solid #dce3f0",outline:"none",boxSizing:"border-box",color:"#1a2744"}
            })
          , busca.length > 0 && React.createElement('span', {
              onClick:()=>{setBusca("");setSugestoes([]);setResultado(null);},
              style:{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",

            }, "×")

// ── Importação de Dados ───────────────────────────────────────────────────────
function Importacao({condos, setCondos, setFin, setInad, setOco, setMan, setCondominos, user, clienteInfo, isAdmin}) {
  const [etapa,    setEtapa]    = useState("upload");
  const [arquivo,  setArquivo]  = useState(null);
  const [dados,    setDados]    = useState(null);
  const [condoSel, setCondoSel] = useState("");
  const [novoNome, setNovoNome] = useState("");
  const [novaSigla,setNovaSigla]= useState("");
  const [progresso,setProgresso]= useState({total:0,feito:0});
  const [log,      setLog]      = useState([]);

  const addLog = (msg, tipo="ok") => setLog(p => [...p, {msg, tipo, ts: new Date().toLocaleTimeString("pt-BR")}]);

  const lerArquivo = (file) => {
    if (!file) return;
    setArquivo(file);
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, {type:"array"});
      const parsed = {};
      const mapAba = {
        "Condom":       "condo",
        "Cond":         "condominos",
        "Financ":       "financeiro",
        "Inadimpl":     "inadimplencia",
        "Ocorr":        "ocorrencias",
        "Manuten":      "manutencoes",
      };
      wb.SheetNames.forEach(name => {
        const cleanName = name.replace(/\p{Emoji}/gu, "").trim();
        const key = Object.entries(mapAba).find(([k]) => cleanName.startsWith(k))?.[1];
        if (!key) return;
        const ws = wb.Sheets[name];
        const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
        parsed[key] = rows.filter(r =>
          Object.values(r).some(v => {
            const s = String(v||"").trim();
            return s !== "" && !s.startsWith("Ex:") && !s.startsWith("\u2191");
          })
        );
      });
      setDados(parsed);
      if (parsed.condo?.[0]) {
        setNovoNome(parsed.condo[0]["Nome *"] || parsed.condo[0]["Nome"] || "");
        setNovaSigla(parsed.condo[0]["Sigla *"] || parsed.condo[0]["Sigla"] || "");
      }
      setEtapa("preview");
    };
    reader.readAsArrayBuffer(file);
  };

  const contagem = dados ? {
    condominos:    dados.condominos?.length    || 0,
    financeiro:    dados.financeiro?.length    || 0,
    inadimplencia: dados.inadimplencia?.length || 0,
    ocorrencias:   dados.ocorrencias?.length   || 0,
    manutencoes:   dados.manutencoes?.length   || 0,
  } : {};

  const importar = async () => {
    setEtapa("importando"); setLog([]);
    let condo_id = condoSel;
    const owner_id = user.id;
    const total = Object.values(contagem).reduce((a,b)=>a+b,0);
    let feito = 0;
    setProgresso({total, feito:0});

    // Verifica limite do plano
    if (!condo_id) {
      const limite = isAdmin ? 999 : getLimiteCondo(clienteInfo);
      if (condos.length >= limite) {
        addLog("Limite de condomínios do plano atingido (" + limite + "). Solicite upgrade.", "erro");
        setEtapa("preview"); return;
      }
    }
    if (!condo_id) {
      addLog("Criando condominio...", "info");
      const cd = dados.condo?.[0] || {};
      const {data, error} = await db.addCondo({
        owner_id,
        nome:           novoNome || cd["Nome *"] || cd["Nome"] || "Novo Condominio",
        sigla:          novaSigla || cd["Sigla *"] || cd["Sigla"] || "NC",
        endereco:       cd["Endereco"] || cd["Endere\u00e7o"] || "",
        cnpj:           cd["CNPJ"] || "",
        unidades:       cd["Unidades"] || "",
        administradora: cd["Administradora"] || "",
        contato:        cd["Contato Adm."] || cd["Contato"] || "",
        cor:            cd["Cor (hex)"] || "#3B82F6",
      });
      if (error) { addLog("Erro: "+error.message, "erro"); setEtapa("preview"); return; }
      condo_id = data.id;
      setCondos(p => [...p, data]);
      addLog("Condominio criado: "+data.nome, "ok");
    } else {
      addLog("Condominio selecionado existente.", "info");
    }

    const toNum = v => Number(String(v||"0").replace(",",".")) || 0;

    if (dados.condominos?.length) {
      addLog("Importando "+dados.condominos.length+" condominos...", "info");
      let ok = 0;
      for (const row of dados.condominos) {
        const nome = row["Nome Cond\u00f4mino *"] || row["Nome Condomino"] || row["Nome"] || "";
        if (!nome) continue;
        const tipo = row["Tipo *"] || row["Tipo"] || "Propriet\u00e1rio";
        const {data, error} = await db.addCondomino({
          owner_id, condo_id,
          unidade:       row["Unidade *"] || row["Unidade"] || "",
          bloco:         row["Bloco"] || "",
          nome, tipo,
          telefone:      row["Telefone"] || "",
          email:         row["E-mail"] || row["Email"] || "",
          prop_nome:     tipo==="Propriet\u00e1rio" ? nome : (row["Nome Propriet\u00e1rio"] || ""),
          prop_telefone: tipo==="Propriet\u00e1rio" ? (row["Telefone"]||"") : (row["Tel. Propriet\u00e1rio"] || ""),
          imob_nome:     row["Nome Imobili\u00e1ria"] || "",
          imob_telefone: row["Tel. Imobili\u00e1ria"] || "",
        });
        if (!error && data) { setCondominos(p=>[...p, data]); ok++; }
        feito++; setProgresso({total, feito});
      }
      addLog(ok+" condominos importados.", "ok");
    }

    if (dados.financeiro?.length) {
      addLog("Importando "+dados.financeiro.length+" lancamentos...", "info");
      let ok = 0;
      for (const row of dados.financeiro) {

// ── Painel Admin ──────────────────────────────────────────────────────────────
function AdminPanel({clientes, setClientes, user, condos}) {
  const [modal,   setModal]   = useState(false);
  const [form,    setForm]    = useState({});
  const [saving,  setSaving]  = useState(false);
  const [filtro,  setFiltro]  = useState("todos");
  const [busca,   setBusca]   = useState("");
  const [tabDetalhe, setTabDetalhe] = useState(null);

  const hoje = new Date().toISOString().slice(0,10);

  const blank = {
    nome:"", email:"", telefone:"", cpf_cnpj:"", endereco:"",
    status:"pendente",
    plano:"profissional",
    valor_mensalidade:"", dia_vencimento:"10",
    tipo_contrato:"anual",
    data_inicio_contrato: hoje, data_fim_contrato:"",
    primeira_mensalidade_paga: false,
    obs:""
  };

  // Calcular data fim automaticamente (anual ou mensal)
  const calcFim = (inicio, tipo) => {
    if (!inicio) return "";
    const d = new Date(inicio);
    tipo === "anual" ? d.setFullYear(d.getFullYear()+1) : d.setMonth(d.getMonth()+1);
    return d.toISOString().slice(0,10);
  };

  const lista = clientes
    .filter(c => filtro==="todos" || c.status===filtro)
    .filter(c => !busca || (c.nome||"").toLowerCase().includes(busca.toLowerCase())
      || (c.email||"").toLowerCase().includes(busca.toLowerCase()));

  // KPIs
  const ativos   = clientes.filter(c=>c.status==="ativo").length;
  const inativos = clientes.filter(c=>c.status==="inativo").length;
  const pendentes= clientes.filter(c=>c.status==="pendente").length;
  const suspensos= clientes.filter(c=>c.status==="suspenso").length;
  const mrr = clientes.filter(c=>c.status==="ativo").reduce((s,c)=>s+Number(c.valor_mensalidade||0),0);

  const openNew  = () => { setForm({...blank, data_fim_contrato: calcFim(hoje,"anual")}); setModal(true); };
  const openEdit = (c)  => { setForm({...c}); setModal(true); };

  const save_ = async () => {
    if(!form.nome||!form.email) return;
    setSaving(true);
    // Auto-ativar se primeira mensalidade paga
    const status = form.primeira_mensalidade_paga ? "ativo" : (form.status==="ativo" ? "ativo" : form.status||"pendente");
    const payload = {...form, status,
      data_fim_contrato: form.data_fim_contrato || calcFim(form.data_inicio_contrato, form.tipo_contrato),
      valor_mensalidade: Number(form.valor_mensalidade||0),
      dia_vencimento: Number(form.dia_vencimento||10),
    };
    if(form.id) {
      const {data} = await db.updCliente(form.id, payload);
      setClientes(p=>p.map(c=>c.id===form.id?data:c));
    } else {
      const {data} = await db.addCliente({...payload, owner_id: user.id});
      setClientes(p=>[data,...p]);
    }
    setSaving(false); setModal(false);
  };

  const del = async (id) => {
    if(!confirm("Remover cliente? Esta ação não pode ser desfeita.")) return;
    await db.delCliente(id);
    setClientes(p=>p.filter(c=>c.id!==id));
    if(tabDetalhe?.id===id) setTabDetalhe(null);
  };

  const toggleAtivo = async (c) => {
    const novoStatus = c.status==="ativo" ? "inativo" : "ativo";
    const {data} = await db.updCliente(c.id, {status: novoStatus});
    setClientes(p=>p.map(x=>x.id===c.id?data:x));
  };

  const formatDate = d => d ? new Date(d+"T00:00:00").toLocaleDateString("pt-BR") : "—";
  const brlVal = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

    ativo:    {bg:"#dcfce7",color:"#15803d"},

    suspenso: {bg:"#fee2e2",color:"#b91c1c"},
  }[s] || {bg:"#f1f5f9",color:"#64748b"});

  const thS = {padding:"9px 12px",fontSize:11,fontWeight:700,color:"white",
    background:"#0f2044",textAlign:"left",whiteSpace:"nowrap"};

    background:i%2===0?"#f8fafc":"white"});

        , mod==="condos"         && React.createElement(Condos, {      condos: condos, setCondos: setCondos, user: user, clienteInfo: clienteInfo, isAdmin: isAdmin})
        , mod==="financeiro"     && React.createElement(Financeiro, { condos: condos, fin: fin, setFin: setFin, sel: sel, user: user})
        , mod==="inadimplencia"  && React.createElement(Inadimplencia, { condos: condos, inadimplencia: inad, setInadimplencia: setInad, sel: sel, user: user})
        , mod==="ocorrencias"    && React.createElement(Ocorrencias, { condos: condos, ocorrencias: oco, setOcorrencias: setOco, sel: sel, user: user})
        , mod==="manutencoes"    && React.createElement(Manutencoes, { condos: condos, manutencoes: man,  setManutencoes: setMan, sel: sel, user: user})
        , mod==="orcamento"      && React.createElement(Orcamento, {   condos: condos, fin: fin, sel: sel, user: user})
        , mod==="perfil"         && React.createElement(Perfil, {      user: user, setUser: setUser, clienteInfo: clienteInfo, isAdmin: isAdmin})
        , mod==="condomino"      && React.createElement(Condomino, {   condos: condos, financeiro: fin, inadimplencia: inad, ocorrencias: oco, manutencoes: man, condominos: conds, setCondominos: setConds, sel: sel, user: user})
        , mod==="importacao"     && React.createElement(Importacao, {  condos: condos, setCondos: setCondos, setFin: setFin, setInad: setInad, setOco: setOco, setMan: setMan, setCondominos: setConds, user: user, clienteInfo: clienteInfo, isAdmin: isAdmin})
        , mod==="admin"          && React.createElement(AdminPanel, { clientes: clientes, setClientes: setClientes, user: user, condos: condos})
        , mod==="admfin"         && React.createElement(AdmFinanceira, { configPlanos: configPlanos, setConfigPlanos: setConfigPlanos, clientes: clientes})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App, {}));
</script>

<script>
// ── Registro do Service Worker (PWA) ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('[PWA] Service Worker registrado:', reg.scope);
        // Notifica quando há atualização disponível
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              console.log('[PWA] Nova versão disponível!');
            }
          });
        });
      })
      .catch(err => console.warn('[PWA] Falha ao registrar SW:', err));
  });
}

// ── Prompt de instalação (Android) ───────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Mostra botão de instalar se disponível
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] App instalado com sucesso!');
  deferredPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if (btn) btn.style.display = 'none';
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choice => {
      console.log('[PWA] Usuário escolheu:', choice.outcome);
      deferredPrompt = null;
    });
  }
}
</script>
